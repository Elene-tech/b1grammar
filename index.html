onst ju=o=>typeof o?.then=="function",Fv=o=>({then(r){return r?Nu(r)(o):this}}),Nu=o=>r=>{try{const c=o(r);return ju(c)?c:Fv(c)}catch(c){return{then(u,h){return h?Nu(h)(c):this}}}},Qv=(o,r)=>(c,u,h)=>{let m={storage:Xv(()=>window.localStorage),partialize:z=>z,version:0,merge:(z,F)=>({...F,...z}),...r},v=!1,S=0;const p=new Set,y=new Set;let k=m.storage;if(!k)return o((...z)=>{console.warn(`[zustand persist middleware] Unable to update item '${m.name}', the given storage is currently unavailable.`),c(...z)},u,h);const w=()=>{const z=m.partialize({...u()});return k.setItem(m.name,{state:z,version:m.version})},U=h.setState;h.setState=(...z)=>(U(...z),w());const q=o((...z)=>(c(...z),w()),u,h);h.getInitialState=()=>q;let I;const Y=()=>{var z,F;if(!k)return;const $=++S;v=!1,p.forEach(ne=>{var oe;return ne((oe=u())!=null?oe:q)});const P=((F=m.onRehydrateStorage)==null?void 0:F.call(m,(z=u())!=null?z:q))||void 0;return Nu(k.getItem.bind(k))(m.name).then(ne=>{if(ne)if(typeof ne.version=="number"&&ne.version!==m.version){if(m.migrate){const oe=m.migrate(ne.state,ne.version);return ju(oe)?oe.then(ve=>[!0,ve]):[!0,oe]}console.error("State loaded from storage couldn't be migrated since no migrate function was provided")}else return[!1,ne.state];return[!1,void 0]}).then(ne=>{var oe;if($!==S)return;const[ve,ee]=ne;if(I=m.merge(ee,(oe=u())!=null?oe:q),c(I,!0),ve)return w()}).then(()=>{$===S&&(P?.(u(),void 0),I=u(),v=!0,y.forEach(ne=>ne(I)))}).then(()=>{},ne=>{$===S&&P?.(void 0,ne)})};return h.persist={setOptions:z=>{m={...m,...z},z.storage&&(k=z.storage)},clearStorage:()=>{++S,k?.removeItem(m.name)},getOptions:()=>m,rehydrate:()=>{try{return Promise.resolve(Y())}catch(z){return Promise.reject(z)}},hasHydrated:()=>v,onHydrate:z=>(p.add(z),()=>{p.delete(z)}),onFinishHydration:z=>(y.add(z),()=>{y.delete(z)})},m.skipHydration||Y(),I||q},Wv=Qv,Pv={id:1,title:{en:"Present Continuous – Present Simple",ru:"Present Continuous – Present Simple",ua:"Present Continuous – Present Simple"},color:"#FF6502",colorSoft:"#FFE8D9",theory:[{heading:{ru:"Present Simple: привычки и факты",ua:"Present Simple: звички та факти",en:"Present simple: habits and facts"},body:{ru:`Present Simple (V / V-s) говорит о привычках, расписаниях и фактах:
• always, usually, often, sometimes, rarely, never, every day/week…
• расписания: The train leaves at 7.45.
• факты и законы: Water boils at 100°C.
• глаголы состояния (like, know, want, need, understand) — почти всегда в Present Simple.
Окончание -s/-es у he/she/it: She works, he watches, it goes.`,ua:`Present Simple (V / V-s) говорить про звички, розклади та факти:
• always, usually, often, sometimes, rarely, never, every day/week…
• розклади: The train leaves at 7.45.
• факти та закони: Water boils at 100°C.
• дієслова стану (like, know, want, need, understand) — майже завжди в Present Simple.
Закінчення -s/-es у he/she/it: She works, he watches, it goes.`,en:`Present simple (V / V-s) talks about habits, timetables and facts:
• always, usually, often, sometimes, rarely, never, every day/week…
• timetables: The train leaves at 7.45.
• facts and laws: Water boils at 100°C.
• stative verbs (like, know, want, need, understand) — almost always present simple.
-s/-es with he/she/it: She works, he watches, it goes.`},table:{head:["","Утверждение","Отрицание","Вопрос"],rows:[["I/you/we/they","work","don't work","Do they work?"],["he/she/it","works","doesn't work","Does she work?"]]},note:{ru:"❌ He work. ✅ He works. ❌ Does she works? ✅ Does she work? (после does/do окончание -s исчезает)",ua:"❌ He work. ✅ He works. ❌ Does she works? ✅ Does she work? (після does/do закінчення -s зникає)",en:"❌ He work. ✅ He works. ❌ Does she works? ✅ Does she work? (after do/does the -s disappears)"}},{heading:{ru:"Present Continuous: происходит сейчас",ua:"Present Continuous: відбувається зараз",en:"Present continuous: happening now"},body:{ru:`Present Continuous (am/is/are + V-ing) говорит о том, что происходит в момент речи:
• now, right now, at the moment, Look!, Listen!, today, tonight
• временные ситуации: these days, this week (She is working very hard these days.)
• договорённости о ближайшем будущем: I am meeting Tom at six. We are flying to Rome tomorrow.
• раздражение с always: He is always losing his keys!`,ua:`Present Continuous (am/is/are + V-ing) говорить про те, що відбувається в момент мовлення:
• now, right now, at the moment, Look!, Listen!, today, tonight
• тимчасові ситуації: these days, this week (She is working very hard these days.)
• домовленості про найближче майбутнє: I am meeting Tom at six. We are flying to Rome tomorrow.
• роздратування з always: He is always losing his keys!`,en:`Present continuous (am/is/are + V-ing) talks about what is happening around now:
• now, right now, at the moment, Look!, Listen!, today, tonight
• temporary situations: these days, this week (She is working very hard these days.)
• arrangements for the near future: I am meeting Tom at six. We are flying to Rome tomorrow.
• irritation with always: He is always losing his keys!`},table:{head:["","Утверждение","Отрицание","Вопрос"],rows:[["I","am working","am not working","Am I working?"],["he/she/it","is working","isn't working","Is she working?"],["you/we/they","are working","aren't working","Are they working?"]]},note:{ru:"Глаголы состояния (know, like, want, understand, need) НЕ используются в Continuous: ❌ I am knowing him. ✅ I know him.",ua:"Дієслова стану (know, like, want, understand, need) НЕ вживаються в Continuous: ❌ I am knowing him. ✅ I know him.",en:"Stative verbs (know, like, want, understand, need) are NOT used in the continuous: ❌ I am knowing him. ✅ I know him."}},{heading:{ru:"Как выбрать время? Маркеры",ua:"Як обрати час? Маркери",en:"Choosing the tense? Signal words"},body:{ru:`Спроси себя: это факт/привычка или действие прямо сейчас / временное?
• every day, usually, always, never → Present Simple
• now, Look!, at the moment, these days → Present Continuous
• tonight, tomorrow + договорённость (I am meeting…) → Present Continuous
• расписание транспорта → Present Simple (The plane leaves at 9.)
Наречия (always, usually, often, sometimes, rarely, never) встают ПЕРЕД смысловым глаголом, но ПОСЛЕ am/is/are:
She always arrives early. She is always arriving late. (порядок слов — см. задания!)`,ua:`Запитай себе: це факт/звичка чи дія прямо зараз / тимчасова?
• every day, usually, always, never → Present Simple
• now, Look!, at the moment, these days → Present Continuous
• tonight, tomorrow + домовленість (I am meeting…) → Present Continuous
• розклад транспорту → Present Simple (The plane leaves at 9.)
Прислівники (always, usually, often, sometimes, rarely, never) стають ПЕРЕД дієсловом, але ПІСЛЯ am/is/are:
She always arrives early. She is always arriving late. (порядок слів — див. завдання!)`,en:`Ask yourself: is it a fact/habit or an action right now / temporary?
• every day, usually, always, never → present simple
• now, Look!, at the moment, these days → present continuous
• tonight, tomorrow + an arrangement (I am meeting…) → present continuous
• transport timetables → present simple (The plane leaves at 9.)
Adverbs (always, usually, often, sometimes, rarely, never) go BEFORE the main verb but AFTER am/is/are:
She always arrives early. She is always arriving late. (word order — see the exercises!)`},table:{head:["Present Simple","Present Continuous"],rows:[["She works in a bank. (постоянно)","She is working at home today. (временно)"],["He usually drives to work.","He is driving to York tonight. (договорённость)"],["The café opens at 8. (расписание)","Look! It is snowing! (сейчас)"]]},note:{ru:"❌ She is work. ✅ She is working. ❌ They works. ✅ They work.",ua:"❌ She is work. ✅ She is working. ❌ They works. ✅ They work.",en:"❌ She is work. ✅ She is working. ❌ They works. ✅ They work."}}],exercises:[{id:"u1-e1",title:{ru:"Диалог «В офисе»",ua:"Діалог «В офісі»",en:"Dialogue: At the office"},level:"core",items:[{type:"multiGap",id:"u1-e1i",instruction:{ru:"Вставьте глаголы из скобок в Present Simple или Present Continuous. Внимание: в диалоге есть и вопросы, и отрицания! Пример: A: What (1) ________ (do) at the moment? → A: What are you doing at the moment? (Пропуск (1) — весь вопрос, поэтому подлежащего you нет в тексте; а там, где подлежащее есть, пропуск идёт после него.)",ua:"Вставте дієслова з дужок у Present Simple або Present Continuous. Зверніть увагу: у діалозі є і запитання, і заперечення! Приклад: A: What (1) ________ (do) at the moment? → A: What are you doing at the moment? (Пропуск (1) — весь вопрос, поэтому подлежащего you нет в тексте; а там, где подлежащее есть, пропуск идёт после него.)",en:"Put the verbs in brackets into the present simple or present continuous. Note: the dialogue has both questions and negatives! Example: A: What (1) ________ (do) at the moment? → A: What are you doing at the moment? (Пропуск (1) — весь вопрос, поэтому подлежащего you нет в тексте; а там, где подлежащее есть, пропуск идёт после него.)"},lines:["A: Hi, Daniel! What {{0}} (do) at the moment?","B: I {{1}} (write) a report for tomorrow's meeting. And you?","A: I {{2}} (wait) for a call from a client in Berlin.","B: {{3}} (usually / spend) your mornings on the phone? Do you mind?","A: Not really. I usually {{4}} (deal) with emails first, but today I {{5}} (work) on this new contract.","B: {{6}} (your husband / work) near here? I think I saw him this morning.","A: Yes, he {{7}} (have) an office on the fourth floor. He {{8}} (usually / get) in at nine.","B: Lucky him! The traffic {{9}} (get) worse every year.","A: True. Listen, {{10}} (want) to grab a coffee after this call?","B: Sure, I {{11}} (not / do) anything important right now."],answers:[["are you doing"],["am writing"],["am waiting"],["Do you usually spend"],["deal"],["am working"],["Does your husband work"],["has"],["usually gets"],["is getting"],["do you want"],["am not doing","'m not doing"]],explain:{ru:"Вопросы: What are you doing? / Do you usually spend…? (после do/does инфинитив без -s). Отрицание: I am not doing. Навязчивый «always» + Present Continuous: He is always losing… (упр. 1.2, реплика 5).",ua:"Запитання: What are you doing? / Do you usually spend…? (після do/does інфінітив без -s). Заперечення: I am not doing. Дратівливий «always» + Present Continuous: He is always losing… (впр. 1.2, репліка 5).",en:"Questions: What are you doing? / Do you usually spend…? (bare infinitive after do/does). Negative: I am not doing. Annoying 'always' + present continuous: He is always losing… (ex. 1.2, line 5)."}}]},{id:"u1-e2",title:{ru:"Диалог «На кухне»",ua:"Діалог «На кухні»",en:"Dialogue: In the kitchen"},level:"core",items:[{type:"multiGap",id:"u1-e2i",instruction:{ru:"Вставьте глаголы из скобок в Present Simple или Present Continuous. Пример: It (1) ________ (smell) wonderful! What (2) ________ (you / cook)? → It smells wonderful! What are you cooking?",ua:"Вставте дієслова з дужок у Present Simple або Present Continuous. Приклад: It (1) ________ (smell) wonderful! What (2) ________ (you / cook)? → It smells wonderful! What are you cooking?",en:"Put the verbs in brackets into the present simple or present continuous. Example: It (1) ________ (smell) wonderful! What (2) ________ (you / cook)? → It smells wonderful! What are you cooking?"},lines:["A: It {{0}} (smell) amazing in here! What {{1}} (you / cook)?","B: A curry. I {{2}} (try) a new recipe from that book you gave me.","A: Great. By the way, {{3}} (you / know) where my keys are? I can never find them.","B: Look on the table — you {{4}} (always / leave) them there!","A: Oh, right. {{5}} (you / do) anything tonight? Some of us {{6}} (meet) at the cinema at eight.","B: I can't. I {{7}} (save) money this month, so I {{8}} (not / go) out much.","A: Fair enough. {{9}} (your sister / live) in Manchester?","B: Yes, but she {{10}} (move) to Leeds next month — she {{11}} (start) a new job there."],answers:[["smells"],["What are you cooking"],["am trying"],["Do you know"],["are always leaving"],["Are you doing"],["are meeting"],["am saving"],["don't go","do not go"],["Does your sister still live"],["is moving"],["is starting"]],explain:{ru:"Глаголы восприятия (smell, know) — Present Simple. «always + -ing» = раздражение: you are always leaving. Договорённости о будущем — Present Continuous: we are meeting / she is moving. Отрицание с обычной привычкой: I don't go out much.",ua:"Дієслова сприйняття (smell, know) — Present Simple. «always + -ing» = роздраження: you are always leaving. Домовленості про майбутнє — Present Continuous: we are meeting / she is moving. Заперечення із звичкою: I don't go out much.",en:"Perception verbs (smell, know) take the present simple. 'Always + -ing' = annoyance: you are always leaving. Future arrangements — present continuous: we are meeting / she is moving. Habit negative: I don't go out much."}}]},{id:"u1-e3",title:{ru:"Откройте скобки",ua:"Відкрийте дужки",en:"Open the brackets"},level:"warmup",items:[{type:"multiTransform",id:"u1-e3i",instruction:{ru:"Раскройте скобки, употребив Present Simple или Present Continuous. Перепишите предложение целиком. Пример: Water (boil) at 100°C. → Water boils at 100°C.",ua:"Розкрийте дужки, вживши Present Simple або Present Continuous. Перепишіть речення повністю. Приклад: Water (boil) at 100°C. → Water boils at 100°C.",en:"Put the verbs in brackets into the present simple or present continuous. Rewrite each sentence in full. Example: Water (boil) at 100°C. → Water boils at 100°C."},sources:["My brother (study) law at the moment, but he (work) as a waiter at weekends.","Water (boil) at 100°C.","I (not / understand) this email. Can you explain it to me?","Listen! (you / hear) that noise downstairs?","The train to Oxford (leave) at 6.45 every morning.","She (usually / drink) coffee, but today she (have) tea.","Why (he / always / complain) about his job?","We (fly) to Lisbon tomorrow evening — the tickets are booked.","My parents (not / watch) TV during the week.","How often (they / go) to the gym?","This laptop (belong) to my colleague, not to me.","(it / rain)? I haven't got an umbrella with me."],answers:[["My brother is studying law at the moment, but he works as a waiter at weekends."],["Water boils at 100°C."],["I don't understand this email. Can you explain it to me?","I do not understand this email. Can you explain it to me?"],["Listen! Do you hear that noise downstairs?","Listen! Can you hear that noise downstairs?"],["The train to Oxford leaves at 6.45 every morning."],["She usually drinks coffee, but today she's having tea.","She usually drinks coffee, but today she is having tea."],["Why is he always complaining about his job?"],["We're flying to Lisbon tomorrow evening — the tickets are booked.","We are flying to Lisbon tomorrow evening — the tickets are booked."],["My parents don't watch TV during the week.","My parents do not watch TV during the week."],["How often do they go to the gym?"],["This laptop belongs to my colleague, not to me."],["Is it raining? I haven't got an umbrella with me."]],explain:{ru:"Факты и расписания — Present Simple (boils, leaves); процессы «сейчас» — Present Continuous (is studying); вопросы: do/does + инфинитив, am/is/are перед подлежащим; отрицания: don't/doesn't + инфинитив или am/is/are not + V-ing.",ua:"Факти й розклади — Present Simple (boils, leaves); процеси «зараз» — Present Continuous (is studying); запитання: do/does + інфінітив, am/is/are перед підметом; заперечення: don't/doesn't + інфінітив або am/is/are not + V-ing.",en:"Facts and timetables — present simple (boils, leaves); actions in progress — present continuous (is studying). Questions: do/does + infinitive, or am/is/are + subject; negatives: don't/doesn't + infinitive, or am/is/are not + V-ing."}}]},{id:"u1-e4",title:{ru:"Выберите правильную форму",ua:"Виберіть правильну форму",en:"Choose the correct form"},level:"warmup",intro:{ru:"Выберите правильный вариант. Обратите внимание на слова-сигналы (now, usually, every day…).",ua:"Виберіть правильний варіант. Зверніть увагу на слова-сигнали (now, usually, every day…).",en:"Choose the correct option. Pay attention to the signal words (now, usually, every day…)."},items:[{type:"choice",id:"u1-e4i0",question:"Look! It snows / is snowing.",options:["snows","is snowing"],correct:"is snowing",explain:{ru:"Look!/Listen!/now → Present Continuous. usually/every day/расписания → Present Simple. Глаголы состояния (believe, own) — почти всегда Present Simple. smell в значении «нюхать» (действие) может быть continuous. these days, тенденции → Present Continuous.",ua:"Look!/Listen!/now → Present Continuous. usually/every day/розклади → Present Simple. Дієслова стану (believe, own) — майже завжди Present Simple. smell у значенні «нюхати» (дія) може бути continuous. these days, тенденції → Present Continuous.",en:"Look!/Listen!/now → present continuous. usually/every day/timetables → present simple. Stative verbs (believe, own) almost always take the present simple. 'smell' as a deliberate action can be continuous. these days, trends → present continuous."}},{type:"choice",id:"u1-e4i1",question:"She works / is working as a nurse, so she knows a lot about medicine.",options:["works","is working"],correct:"w Present Continuous.",en:"Look!/Listen!/now → present continuous. usually/every day/timetables → present simple. Stative verbs (believe, own) almost always take the present simple. 'smell' as a deliberate action can be continuous. these days, trends → present continuous."}},{type:"choice",id:"u1-e4i10",question:"Why do you smell / are you smelling the milk? It's fresh!",options:["do you smell","are you smelling"],correct:"are you smelling",explain:{ru:"Look!/Listen!/now → Present Continuous. usually/every day/расписания → Present Simple. Глаголы состояния (believe, own) — почти всегда Present Simple. smell в значении «нюхать» (действие) может быть continuous. these days, тенденции → Present Continuous.",ua:"Look!/Listen!/now → Present Continuous. usually/every day/розклади → Present Simple. Дієслова стану (believe, own) — майже завжди Present Simple. smell у значенні «нюхати» (дія) може бути continuous. these days, тенденції → Present Continuous.",en:"Look!/Listen!/now → present continuous. usually/every day/timetables → present simple. Stative verbs (believe, own) almost always take the present simple. 'smell' as a deliberate action can be continuous. these days, trends → present continuous."}},{type:"choice",id:"u1-e4i11",question:"The course starts / is starting in October — it's in the timetable.",options:["starts","is starting"],correct:"starts",explain:{ru:"Look!/Listen!/now → Present Continuous. usually/every day/расписания → Present Simple. Глаголы состояния (believe, own) — почти всегда Present Simple. smell в значении «нюхать» (действие) может быть continuous. these days, тенденции → Present Continuous.",ua:"Look!/Listen!/now → Present Continuous. usually/every day/розклади → Present Simple. Дієслова стану (believe, own) — майже завжди Present Simple. smell у значенні «нюхати» (дія) може бути continuous. these days, тенденції → Present Continuous.",en:"Look!/Listen!/now → present continuous. usually/every day/timetables → present simple. Stative verbs (believe, own) almost always take the present simple. 'smell' as a deliberate action can be continuous. these days, trends → present continuous."}}]},{id:"u1-e5",title:{ru:"Отрицательная форма",ua:"Заперечна форма",en:"Negative forms"},level:"core",items:[{type:"multiTransform",id:"u1-e5i",instruction:{ru:"Напишите отрицательную форму каждого предложения. Не меняйте время. Пример: She works in the marketing department. → She doesn't work in the marketing department.",ua:"Напишіть заперечну форму кожного речення. Не змінюйте час. Приклад: She works in the marketing department. → She doesn't work in the marketing department.",en:"Write the negative form of each sentence. Do not change the tense. Example: She works in the marketing department. → She doesn't work in the marketing department."},sources:["She works in the marketing department.","They are discussing the budget right now.","He drives to the office every day.","I am expecting an important letter today.","We know the new manager.","It rains a lot here in autumn.","She is wearing a coat today.","My phone needs a new battery.","The children are sleeping at the moment.","He always pays on time.","They believe everything they read online.","I feel tired this morning."],answers:[["She doesn't work in the marketing department.","She does not work in the marketing department."],["They aren't discussing the budget right now.","They're not discussing the budget right now.","They are not discussing the budget right now."],["He doesn't drive to the office every day.","He does not drive to the office every day."],["I'm not expecting an important letter today.","I am not expecting an important letter today."],["We don't know the new manager.","We do not know the new manager."],["It doesn't rain a lot here in autumn.","It does not rain a lot here in autumn."],["She isn't wearing a coat today.","She's not wearing a coat today.","She is not wearing a coat today."],["My phone doesn't need a new battery.","My phone does not need a new battery."],["The children aren't sleeping at the moment.","The children are not sleeping at the moment.","The children are not sleeping at the moment."],["He doesn't always pay on time.","He does not always pay on time."],["They don't believe everything they read online.","They do not believe everything they read online."],["I don't feel tired this morning.","I do not feel tired this morning."]],explain:{ru:"Present Simple: don't/doesn't + инфинитив (He doesn't drive). Present Continuous: am/is/are not + V-ing (They aren't discussing). Наречие обычно остаётся на месте: He doesn't always pay — не *He always doesn't pay.",ua:"Present Simple: don't/doesn't + інфінітив (He doesn't drive). Present Continuous: am/is/are not + V-ing (They aren't discussing). Прислівник зазвичай лишається на місці: He doesn't always pay — не *He always doesn't pay.",en:"Present simple: don't/doesn't + infinitive (He doesn't drive). Present continuous: am/is/are not + V-ing (They aren't discussing). The adverb usually stays in place: He doesn't always pay — not *He always doesn't pay."}}]},{id:"u1-e6",title:{ru:"Вопросительная форма",ua:"Питальна форма",en:"Question forms"},level:"core",items:[{type:"multiTransform",id:"u1-e6i",instruction:{ru:"Составьте вопрос. Начните со слов(а) в скобках. Пример: She works on Saturdays. (When) → When does she work?",ua:"Складіть запитання. Почніть зі слова (слів) у дужках. Приклад: She works on Saturdays. (When) → When does she work?",en:"Make a question. Start with the word(s) in brackets. Example: She works on Saturdays. (When) → When does she work?"},sources:["She works on Saturdays. (When → she)","They are moving house this month. (Why → they)","He speaks three foreign languages. (How many languages → he)","You are using my laptop. (Whose laptop → you)","The shop closes at nine. (What time → the shop)","She is looking for a new flat. (What → she)","They play tennis twice a week. (How often → they)","He is saving for a motorbike. (What → he / save for)","This bus goes to the airport. (Where → this bus)","You know her brother. (How well → you)","It smells of fresh paint in here. (Why → it)","We are meeting the clients at noon. (Who → we)"],answers:[["When does she work?"],["Why are they moving house this month?"],["How many languages does he speak?"],["Whose laptop are you using?"],["What time does the shop close?"],["What is she looking for?"],["How often do they play tennis?"],["What is he saving for?"],["Where does this bus go?"],["How well do you know her brother?"],["Why does it smell of fresh paint in here?"],["Who are we meeting at noon?"]],explain:{ru:"Present Simple: вопросительное слово + do/does + подлежащее + инфинитив (When does she work?). Present Continuous: вопросительное слово + am/is/are + подлежащее + V-ing (What is she looking for?). После do/does окончание -s исчезает.",ua:"Present Simple: питальне слово + do/does + підмет + інфінітив (When does she work?). Present Continuous: питальне слово + am/is/are + підмет + V-ing (What is she looking for?). Після do/does закінчення -s зникає.",en:"Present simple: question word + do/does + subject + infinitive (When does she work?). Present continuous: question word + am/is/are + subject + V-ing (What is she looking for?). The -s disappears after do/does."}}]},{id:"u1-e7",title:{ru:"Краткие ответы",ua:"Стислі відповіді",en:"Short answers"},level:"core",items:[{type:"multiTransform",id:"u1-e7i",instruction:{ru:"Дайте краткий ответ на вопрос. Используйте местоимение и подсказку в скобках (yes / no). Пример: Does your office close early on Fridays? (yes) → Yes, it does.",ua:"Дайте стислу відповідь на запитання. Використайте займенник і підказку в дужках (yes / no). Приклад: Does your office close early on Fridays? (yes) → Yes, it does.",en:"Give a short answer to each question. Use the pronoun and the cue in brackets (yes / no). Example: Does your office close early on Fridays? (yes) → Yes, it does."},sources:["Does your office close early on Fridays? (yes)","Are you coming to the conference next week? (no)","Do they accept credit cards in that café? (yes)","Is she enjoying her new course? (yes)","Does he commute every day? (no)","Are the tickets getting more expensive? (yes)","Do you need any help with that? (no)","Is it raining outside? (yes)","Does your landlord answer emails quickly? (no)","Are we taking the nine o'clock train? (yes)","Does this programme usually finish late? (no)","Is your sister still looking for a job? (yes)"],answers:[["Yes, it does."],["No, I'm not.","No, I am not."],["Yes, they do."],["Yes, she is."],["No, he doesn't.","No, he does not."],["Yes, they are."],["No, I don't.","No, I do not."],["Yes, it is."],["No, he doesn't.","No, he does not."],["Yes, we are."],["No, it doesn't.","No, it does not."],["Yes, she is."]],explain:{ru:"Краткий ответ повторяет вспомогательный глагол: Do you…? — Yes, I do. / Is she…? — Yes, she is. Не отвечайте полным предложением на общие вопросы.",ua:"Стисла відповідь повторює допоміжне дієслово: Do you…? — Yes, I do. / Is she…? — Yes, she is. Не відповідайте повним реченням на загальні запитання.",en:"The short answer repeats the auxiliary: Do you…? — Yes, I do. / Is she…? — Yes, she is. Do not answer general questions with a full sentence."}}]},{id:"u1-e8",title:{ru:"Отрицание + вопрос",ua:"Заперечення + запитання",en:"Negative and question"},level:"challenge",items:[{type:"multiTransform",id:"u1-e8i",multiAnswers:!0,instruction:{ru:"Напишите к каждому предложению сначала отрицание, затем вопрос (без вопросительного слова). Напишите отрицание, затем вопрос, разделив их знаком « / ». Пример: He phones his parents. → He doesn't phone his parents. / Does he phone his parents? Пример: He phones his parents every Sunday. → He doesn't phone his parents every Sunday. / Does he phone his parents every Sunday?",ua:"Напишіть до кожного речення спочатку заперечення, потім запитання (без питального слова). Напишіть заперечення, потім запитання, розділивши їх знаком « / ». Приклад: He phones his parents. → He doesn't phone his parents. / Does he phone his parents? Приклад: He phones his parents every Sunday. → He doesn't phone his parents every Sunday. / Does he phone his parents every Sunday?",en:`For each sentence write first the negative form, then the question (without a question word). Write the negative, then the question, separated by " / ". Example: He phones his parents. → He doesn't phone his parents. / Does he phone his parents? Example: He phones his parents every Sunday. → He doesn't phone his parents every Sunday. / Does he phone his parents every Sunday?`},sources:["He phones his parents every Sunday.","The neighbours are having a party tonight.","She finishes work at six.","You are sitting in my seat.","They sell fresh bread in that shop.","I am using the printer at the moment.","He takes sugar in his coffee.","The team is performing well this season.","We leave the office at five.","Her boyfriend works abroad.","The lift is working today.","It costs a fortune to park in the centre."],answers:[["He doesn't phone his parents every Sunday.","Does he phone his parents every Sunday?"],["The neighbours aren't having a party tonight.","Are the neighbours having a party tonight?"],["She doesn't finish work at six.","Does she finish work at six?"],["You aren't sitting in my seat.","Are you sitting in my seat?"],["They don't sell fresh bread in that shop.","Do they sell fresh bread in that shop?"],["I am not using the printer at the moment.","Am I using the printer at the moment?"],["He doesn't take sugar in his coffee.","Does he take sugar in his coffee?"],["The team isn't performing well this season.","Is the team performing well this season?"],["We don't leave the office at five.","Do we leave the office at five?"],["Her boyfriend doesn't work abroad.","Does her boyfriend work abroad?"],["The lift isn't working today.","Is the lift working today?"],["It doesn't cost a fortune to park in the centre.","Does it cost a fortune to park in the centre?"]],pairs:[[["He doesn't phone his parents every Sunday.","Does he phone his parents every Sunday?"],["He does not phone his parents every Sunday.","Does he phone his parents every Sunday?"]],[["The neighbours aren't having a party tonight.","Are the neighbours having a party tonight?"],["The neighbours are not having a party tonight.","Are the neighbours having a party tonight?"]],[["She doesn't finish work at six.","Does she finish work at six?"],["She does not finish work at six.","Does she finish work at six?"]],[["You aren't sitting in my seat.","Are you sitting in my seat?"],["You are not sitting in my seat.","Are you sitting in my seat?"]],[["They don't sell fresh bread in that shop.","Do they sell fresh bread in that shop?"],["They do not sell fresh bread in that shop.","Do they sell fresh bread in that shop?"]],[["I am not using the printer at the moment.","Am I using the printer at the moment?"]],[["He doesn't take sugar in his coffee.","Does he take sugar in his coffee?"],["He does not take sugar in his coffee.","Does he take sugar in his coffee?"]],[["The team isn't performing well this season.","Is the team performing well this season?"],["The team is not performing well this season.","Is the team performing well this season?"]],[["We don't leave the office at five.","Do we leave the office at five?"],["We do not leave the office at five.","Do we leave the office at five?"]],[["Her boyfriend doesn't work abroad.","Does her boyfriend work abroad?"],["Her boyfriend does not work abroad.","Does her boyfriend work abroad?"]],[["The lift isn't working today.","Is the lift working today?"],["The lift is not working today.","Is the lift working today?"]],[["It doesn't cost a fortune to park in the centre.","Does it cost a fortune to park in the centre?"],["It does not cost a fortune to park in the centre.","Does it cost a fortune to park in the centre?"]]],explain:{ru:"Тренировка двух структур сразу: don't/doesn't + инфинитив и am/is/are not + V-ing; вопросы Do/Does + подлежащее + инфинитив и Am/Is/Are + подлежащее + V-ing. Именно смешение этих форм — самая частая ошибка.",ua:"Тренування двох структур одразу: don't/doesn't + інфінітив і am/is/are not + V-ing; запитання Do/Does + підмет + інфінітив і Am/Is/Are + підмет + V-ing. Саме змішування цих форм — найчастіша помилка.",en:"Drills both structures side by side: don't/doesn't + infinitive and am/is/are not + V-ing; questions Do/Does + subject + infinitive and Am/Is/Are + subject + V-ing. Mixing these forms is the most common mistake."}}]},{id:"u1-e9",title:{ru:"Место наречия",ua:"Місце прислівника",en:"Adverb position"},level:"core",items:[{type:"multiTransform",id:"u1-e9i",instruction:{ru:"Поставьте наречие из скобок в правильное место в предложении и перепишите его. Пример: She is late for work. (always) → She is always late for work.",ua:"Поставте прислівник з дужок у правильне місце в реченні та перепишіть його. Приклад: She is late for work. (always) → She is always late for work.",en:"Put the adverb in brackets in the correct position and rewrite the sentence. Example: She is late for work. (always) → She is always late for work."},sources:["She is late for work. (always)","Do you drink coffee in the morning? (usually)","He doesn't watch the news. (often)","They are complaining about the service. (constantly)","We have lunch at our desks. (hardly ever)","Does she travel abroad for work? (frequently)","I am forgetting people's names these days. (always)","My train is delayed. (rarely)","He is checking his phone during meetings. (always)","Read the contract carefully before you sign anything. (always)"],answers:[["She is always late for work."],["Do you usually drink coffee in the morning?"],["He doesn't often watch the news.","He does not often watch the news."],["They're constantly complaining about the service.","They are constantly complaining about the service."],["We hardly ever have lunch at our desks."],["Does she frequently travel abroad for work?"],["I am always forgetting people's names these days.","I'm always forgetting people's names these days."],["My train is rarely delayed."],["He's always checking his phone during meetings.","He is always checking his phone during meetings."],["Always read the contract carefully before you sign anything."]],explain:{ru:"Обычные наречия (usually, often, rarely) — перед основным глаголом: She usually works…, но после глагола to be: She is always late. Отрицание: He doesn't often watch (не *He often doesn't watch). Imperative: Always read…",ua:"Звичайні прислівники (usually, often, rarely) — перед основним дієсловом: She usually works…, але після дієслова to be: She is always late. Заперечення: He doesn't often watch (не *He often doesn't watch). Наказ: Always read…",en:"Ordinary adverbs (usually, often, rarely) go before the main verb: She usually works…, but after the verb 'to be': She is always late. In negatives: He doesn't often watch (not *He often doesn't watch). Imperatives: Always read…"}}]},{id:"u1-e10",title:{ru:"Глаголы состояния",ua:"Дієслова стану",en:"Stative verbs"},level:"core",items:[{type:"multiTransform",id:"u1-e10i",instruction:{ru:"В каждом предложении есть ошибка с глаголом состояния. Исправьте её. Пример: I am knowing the answer. → I know the answer.",ua:"У кожному реченні є помилка з дієсловом стану. Виправте її. Приклад: I am knowing the answer. → I know the answer.",en:"Each sentence has a stative-verb mistake. Correct it. Example: I am knowing the answer. → I know the answer."},sources:["I am knowing the answer to your question.","She is wanting to change her job.","This soup is tasting strange.","He is believing everything the media says.","We are needing more time to decide.","This document is belonging to the finance department.","Are you understanding my point?","She is having two sisters.","I am thinking he is right about the schedule.","These shoes are fitting me perfectly.","He is hating his daily commute.","The meeting is consisting of three short parts."],answers:[["I know the answer to your question."],["She wants to change her job."],["This soup tastes strange."],["He believes everything the media says."],["We need more time to decide."],["This document belongs to the finance department."],["Do you understand my point?"],["She has two sisters."],["I think he is right about the schedule."],["These shoes fit me perfectly."],["He hates his daily commute."],["The meeting consists of three short parts."]],explain:{ru:"Глаголы состояния (know, want, need, belong, understand, have = обладать, fit, hate, consist) не употребляются в continuous. Исключение — когда меняется значение: I'm having lunch (eat), This soup tastes strange всё же stative… сравните упр. 1.2: It smells amazing.",ua:"Дієслова стану (know, want, need, belong, understand, have = володіти, fit, hate, consist) не вживаються в continuous. Виняток — коли змінюється значення: I'm having lunch (eat); порівняйте впр. 1.2: It smells amazing.",en:"Stative verbs (know, want, need, belong, understand, have = possess, fit, hate, consist) are not used in continuous forms. Exception — when the meaning changes: I'm having lunch (eating); compare ex. 1.2: It smells amazing."}}]},{id:"u1-e11",title:{ru:"Слова-сигналы: страница дневника",ua:"Слова-сигнали: сторінка щоденника",en:"Signal words: a diary page"},level:"core",items:[{type:"multiGap",id:"u1-e11i",instruction:{ru:`Впишите подходящее слово-сигнал из рамки. Каждое слово используется один раз.
usually · at the moment · twice a week · on Fridays · always · never · often · these days · rarely · every day · right now · tonight Пример: My alarm goes off at 6.30 and I (1) usually get up straight away — well, almost.`,ua:`Впишіть відповідне слово-сигнал з рамки. Кожне слово вживається один раз.
usually · at the moment · twice a week · on Fridays · always · never · often · these days · rarely · every day · right now · tonight Приклад: My alarm goes off at 6.30 and I (1) usually get up straight away — well, almost.`,en:`Complete the text with the signal words from the box. Use each word once.
usually · at the moment · twice a week · on Fridays · always · never · often · these days · rarely · every day · right now · tonight Example: My alarm goes off at 6.30 and I (1) usually get up straight away — well, almost.`},lines:["My alarm goes off at 6.30 and I {{0}} get up straight away — well, almost.","{{1}}, over my morning coffee, I'm checking flights to Valencia — I'm planning a trip there.","I go to the gym {{2}}, on Tuesdays and Thursdays, before work.","{{3}} we finish at four, and the whole office relaxes a little.","My manager {{4}} writes emails at midnight, so I read them first thing in the morning.","{{5}} do I take work home — only in a real emergency.","The canteen {{6}} serves something decent, but I still bring my own lunch.","{{7}} my cousin is staying with me, so in the evenings we cook together.","We eat out {{8}} — maybe once a fortnight, when the week has been long.","I water the plants {{9}} — they would die without me.","{{10}} — at this very minute — I'm writing this diary on a delayed train.","And {{11}} I'm meeting an old friend for dinner, so the day will end well."],answers:[["usually"],["At the moment"],["twice a week"],["On Fridays"],["always"],["Never"],["often"],["These days"],["rarely"],["every day"],["Right now"],["tonight"]],explain:{ru:"Наречия частоты (usually, always, never, rarely) → привычки, Present Simple. at the moment / right now / these days / tonight → Present Continuous. twice a week, every day, on Fridays — типичные сигналы Present Simple.",ua:"Прислівники частоти (usually, always, never, rarely) → звички, Present Simple. at the moment / right now / these days / tonight → Present Continuous. twice a week, every day, on Fridays — типові сигнали Present Simple.",en:"Frequency adverbs (usually, always, never, rarely) point to habits — present simple. at the moment / right now / these days / tonight → present continuous. twice a week, every day, on Fridays are typical present simple signals."}}]},{id:"u1-e12",title:{ru:"Порядок слов",ua:"Порядок слів",en:"Word order"},level:"core",items:[{type:"multiTransform",id:"u1-e12i",instruction:{ru:"Составьте предложения из слов. Меняйте форму слов, где нужно. Пример: never / she / on time / is → She is never on time.",ua:"Складіть речення зі слів. Змінюйте форму слів, де потрібно. Приклад: never / she / on time / is → She is never on time.",en:"Make sentences from the words. Change the word forms where necessary. Example: never / she / on time / is → She is never on time."},sources:["she / never / on time / is (she)","we / at the moment / for / a flat / looking / are (we)","does / how often / the train / from Leeds / leave (the train)","I / don't / understand / this instruction manual (I)","his keys / losing / he / is / always (he)","tonight / working / Jenny / late / is (Jenny)","the office / usually / at eight / opens (the office)","you / what / about / are / thinking (you)","their / they / every year / grandparents / visit (they)","the photocopier / why / is / not / working (the photocopier)","we / rarely / eat / before nine / dinner (we)","it / heavily / at this time of day / raining / is (it)"],answers:[["She is never on time."],["We're looking for a flat at the moment.","We are looking for a flat at the moment."],["How often does the train from Leeds leave?"],["I don't understand this instruction manual.","I do not understand this instruction manual."],["He's always losing his keys.","He is always losing his keys."],["Jenny's working late tonight.","Jenny is working late tonight."],["The office usually opens at eight."],["What are you thinking about?"],["They visit their grandparents every year."],["Why isn't the photocopier working?","Why is the photocopier not working?"],["We rarely eat dinner before nine."],["It's raining heavily at this time of day.","It is raining heavily at this time of day."]],explain:{ru:"Порядок слов: вопросы — вспомогательный глагол перед подлежащим (How often does the train leave?); наречия частоты перед глаголом, но после to be (She is never on time); фразовые глаголы: looking for, thinking about — предлог не отрывается.",ua:"Порядок слів: питання — допоміжне дієслово перед підметом (How often does the train leave?); прислівники частоти перед дієсловом, але після to be (She is never on time); фразові дієслова: looking for, thinking about — прийменник не відривається.",en:"Word order: in questions the auxiliary comes before the subject (How often does the train leave?); frequency adverbs go before the verb but after 'to be' (She is never on time); in phrasal verbs (looking for, thinking about) the preposition stays attached."}}]},{id:"u1-e13",title:{ru:"Найдите и исправьте ошибку",ua:"Знайдіть і виправте помилку",en:"Find and correct the mistake"},level:"challenge",items:[{type:"multiTransform",id:"u1-e13i",instruction:{ru:"В каждом предложении одна грамматическая ошибка (время, вопрос, отрицание). Исправьте её. Пример: She don't like spicy food. → She doesn't like spicy food.",ua:"У кожному реченні одна граматична помилка (час, запитання, заперечення). Виправте її. Приклад: She don't like spicy food. → She doesn't like spicy food.",en:"Each sentence has one grammar mistake (tense, question or negative). Correct it. Example: She don't like spicy food. → She doesn't like spicy food."},sources:["She don't like spicy food.","I am agree with you.","Does he works here?","Look! It raining.","He is drive to work today.","We are needing a bigger office.","She always is early.","What you are doing tonight?","I doesn't understand the question.","They are live in a small village.","My sister have a new job.","He don't answer his phone at the moment."],answers:[["She doesn't like spicy food.","She does not like spicy food."],["I agree with you."],["Does he work here?"],["Look! It's raining.","Look! It is raining."],["He's driving to work today.","He is driving to work today."],["We need a bigger office."],["She's always early.","She is always early."],["What are you doing tonight?"],["I don't understand the question.","I do not understand the question."],["They live in a small village."],["My sister has a new job."],["He isn't answering his phone at the moment.","He is not answering his phone at the moment."]],explain:{ru:"Типичные ошибки: he/she/it → doesn't (не don't); после do/does инфинитив (Does he work); be + V-ing обязательно (It is raining); наречие после to be (She is always early); вопрос: are перед подлежащим (What are you doing).",ua:"Типові помилки: he/she/it → doesn't (не don't); після do/does інфінітив (Does he work); be + V-ing обов'язково (It is raining); прислівник після to be (She is always early); питання: are перед підметом (What are you doing).",en:"Typical mistakes: he/she/it → doesn't (not don't); bare infinitive after do/does (Does he work); be + V-ing is compulsory (It is raining); the adverb goes after 'to be' (She is always early); in questions the auxiliary comes first (What are you doing)."}}]},{id:"u1-e14",title:{ru:"Текст: служебная записка",ua:"Текст: службова записка",en:"Text: a work email"},level:"core",items:[{type:"multiGap",id:"u1-e14i",instruction:{ru:"Прочитайте письмо и вставьте глаголы из скобок в Present Simple или Present Continuous. Пример: As you know, our company (introduce) flexible working from next month. → As you know, our company is introducing flexible working from next month.",ua:"Прочитайте листа й вставте дієслова з дужок у Present Simple або Present Continuous. Приклад: As you know, our company (introduce) flexible working from next month. → As you know, our company is introducing flexible working from next month.",en:"Read the email and put the verbs in brackets into the present simple or present continuous. Example: As you know, our company (introduce) flexible working from next month. → As you know, our company is introducing flexible working from next month."},lines:["Hi Marta,","As you know, our company {{0}} (introduce) flexible working from next month.","Each team {{1}} (decide) which days to spend in the office.","At the moment we {{2}} (discuss) the details with HR, so nothing is final yet.","I {{3}} (think) it's a great idea — the commute {{4}} (take) me nearly an hour each way.","On the days I {{5}} (work) from home, I {{6}} (save) almost ten hours a week.","Some people {{7}} (worry) that communication {{8}} (suffer), but we {{9}} (use) video calls all the time already, so I {{10}} (not / be) too concerned.","I {{11}} (attach) the draft schedule — could you have a look before Friday?","Best regards, Tom"],answers:[["is introducing"],["decides"],["are discussing"],["think"],["takes"],["work"],["save"],["worry","are worrying"],["will suffer","suffers"],["are using"],["am not","'m not"],["am attaching","'m attaching"]],explain:{ru:"Официальные изменения (почти как расписание) — Present Simple: Each team decides. Временное действие: at the moment → are discussing. Договорённость «прилагаю»: I am attaching. I think — глагол состояния, Present Simple.",ua:"Офіційні зміни (майже як розклад) — Present Simple: Each team decides. Тимчасова дія: at the moment → are discussing. Домовленість «додаю»: I am attaching. I think — дієслово стану, Present Simple.",en:"Official decisions (almost like timetables) take the present simple: Each team decides. A temporary action: at the moment → are discussing. The arrangement 'I am attaching' uses the present continuous. I think is a stative verb — present simple."}}]},{id:"u1-e15",title:{ru:"Перефразируйте",ua:"Перефразуйте",en:"Rewrite the sentences"},level:"challenge",items:[{type:"multiTransform",id:"u1-e15i",instruction:{ru:"Перепишите предложения, сохраняя смысл. Используйте слово в скобках. Пример: He usually walks to the office. (drives) → He usually drives to the office.",ua:"Перепишіть речення, зберігаючи зміст. Використайте слово в дужках. Приклад: He usually walks to the office. (drives) → He usually drives to the office.",en:"Rewrite the sentences so the meaning stays the same. Use the word in brackets. Example: He usually walks to the office. (drives) → He usually drives to the office."},sources:["He usually walks to the office. (goes)","She doesn't often eat meat. (rarely)","When does the library open? (What time)","They are living in a hotel right now. (staying)","In my opinion, this phone is too slow. (think)","We don't know his address. (no idea)","This train journey is very expensive. (costs)","He is employed by a large bank. (works)","She has a shower before breakfast every day. (always)","Are you free for a few minutes? (have)"],answers:[["He usually goes to the office on foot."],["She rarely eats meat."],["What time does the library open?"],["They're staying in a hotel right now.","They are staying in a hotel right now."],["I think this phone is too slow."],["We have no idea what his address is."],["This train journey costs a lot (of money).","This train journey costs a fortune."],["He works for a large bank."],["She always has a shower before breakfast.","She always has a shower before breakfast every day."],["Do you have a few minutes (to spare)?"]],explain:{ru:"Тренировка замен без смены времени: goes … on foot = walks; rarely = not often; stay = live (временно); I think = In my opinion; always + have для привычки; Does…? сохраняет структуру вопроса.",ua:"Тренування замін без зміни часу: goes … on foot = walks; rarely = not often; stay = live (тимчасово); I think = In my opinion; always + have для звички; Does…? зберігає структуру питання.",en:"Paraphrase without changing the tense: goes … on foot = walks; rarely = not often; stay = live (temporarily); I think = In my opinion; always + have for habits; Does…? keeps the question structure."}}]}]},Zv={id:2,title:{en:'Past Simple and "used to"',ru:'Past Simple и конструкция "used to"',ua:'Past Simple та конструкція "used to"'},color:"#E84393",colorSoft:"#FDE3EF",theory:[{heading:{ru:"Past Simple: завершённое прошлое",ua:"Past Simple: завершене минуле",en:"Past Simple: finished past"},body:{ru:`Это прошедшее простое время. Мы используем его для действий, которые начались и закончились в прошлом, в известный момент. Правильные глаголы добавляют -ed (work → worked), неправильные меняются по таблице (go → went, see → saw).
Примеры: I visited my grandma last weekend. She bought a new phone yesterday.`,ua:`Це минулий простий час. Ми використовуємо його для дій, які почалися і закінчилися в минулому, у відомий момент. Правильні дієслова додають -ed (work → worked), неправильні змінюються за таблицею (go → went, see → saw).
Приклади: I visited my grandma last weekend. She bought a new phone yesterday.`,en:`We use the past simple for actions that started and finished in the past, at a known time. Regular verbs add -ed (work → worked); irregular verbs change (go → went, see → saw).
Examples: I visited my grandma last weekend. She bought a new phone yesterday.`},table:{head:["","Утверждение","Отрицание","Вопрос"],rows:[["все лица","worked / went","didn't work / didn't go","Did you work / go?"]]},note:{ru:"После did / didn't глагол всегда в начальной форме: ❌ Did you went? ✅ Did you go?",ua:"Після did / didn't дієслово завжди в початковій формі: ❌ Did you went? ✅ Did you go?",en:"After did / didn't the verb is always in its base form: ❌ Did you went? ✅ Did you go?"}},{heading:{ru:'"Used to": привычки из прошлого',ua:'"Used to": звички з минулого',en:'"Used to": past habits'},body:{ru:`Конструкция used to + глагол означает: «раньше делал так, но больше не делаю». Она описывает привычки и состояния, которые были в прошлом и изменились.
Примеры: I used to play football every day. (раньше играл, теперь нет) She used to live in Lviv. (раньше жила, теперь переехала)
Отрицание: didn't use to. Вопрос: Did you use to...?`,ua:`Конструкція used to + дієслово означає: «раніше робив так, але більше не роблю». Вона описує звички та стани, які були в минулому і змінилися.
Приклади: I used to play football every day. (раніше грав, тепер ні) She used to live in Lviv. (раніше жила, тепер переїхала)
Заперечення: didn't use to. Питання: Did you use to...?`,en:`Used to + verb means: “I did it in the past, but I don't do it any more.” It describes past habits and states that have changed.
Examples: I used to play football every day. (before, but not now) She used to live in Lviv. (before, she moved)
Negative: didn't use to. Question: Did you use to...?`},note:{ru:"В вопросах и отрицаниях форма не меняется: didn't use to (НЕ didn't used to). Не путайте: be used to + -ing = «привыкнуть к чему-то».",ua:"В питаннях і запереченнях форма не змінюється: didn't use to (НЕ didn't used to). Не плутайте: be used to + -ing = «звикнути до чогось».",en:"In questions and negatives the form stays: didn't use to (NOT didn't used to). Do not confuse with: be used to + -ing = “be accustomed to something”."}},{heading:{ru:"Маркеры и типичные ошибки",ua:"Маркери та типові помилки",en:"Time markers and typical mistakes"},body:{ru:`Маркеры Past Simple: yesterday, last night/week/year, two days ago, in 2010, just now (в значении «только что, в прошлом контексте»).
Частые ошибки:
1. ❌ I have seen him yesterday. ✅ I saw him yesterday. (с ago/yesterday не используем Present Perfect)
2. ❌ Did you went home? ✅ Did you go home?
3. ❌ She didn't came. ✅ She didn't come.`,ua:`Маркери Past Simple: yesterday, last night/week/year, two days ago, in 2010.
Часті помилки:
1. ❌ I have seen him yesterday. ✅ I saw him yesterday. (з ago/yesterday не використовуємо Present Perfect)
2. ❌ Did you went home? ✅ Did you go home?
3. ❌ She didn't came. ✅ She didn't come.`,en:`Past simple markers: yesterday, last night/week/year, two days ago, in 2010.
Common mistakes:
1. ❌ I have seen him yesterday. ✅ I saw him yesterday. (never present perfect with ago/yesterday)
2. ❌ Did you went home? ✅ Did you go home?
3. ❌ She didn't came. ✅ She didn't come.`}}],exercises:[{id:"u2-warmup",title:{ru:"Разминка: формы Past Simple",ua:"Розминка: форми Past Simple",en:"Warm-up: past simple forms"},level:"warmup",items:[{type:"gap",id:"u2w1",before:"I",after:"my grandma last weekend. (visit)",answer:["visited"],explain:{ru:"last weekend → Past Simple. Правильный глагол: visit + -ed = visited.",ua:"last weekend → Past Simple. Правильне дієслово: visit + -ed = visited.",en:"“Last weekend” → past simple. Regular verb: visit + -ed = visited."}},{type:"gap",id:"u2w2",before:"She",after:"to school yesterday. She was ill. (not go)",answer:["didn't go","did not go"],explain:{ru:"Отрицание в Past Simple: didn't + начальная форма → didn't go.",ua:"Заперечення в Past Simple: didn't + початкова форма → didn't go.",en:"Past simple negative: didn't + base form → didn't go."}},{type:"gap",id:"u2w3",before:"",after:"the film last night? It was brilliant! (you see)",answer:["did you see"],explain:{ru:"Вопрос в Past Simple: Did + подлежащее + глагол → Did you see.",ua:"Питання в Past Simple: Did + підмет + дієслово → Did you see.",en:"Past simple question: Did + subject + verb → Did you see."}},{type:"gap",id:"u2w4",before:"They",after:"a new car two weeks ago. (buy)",answer:["bought"],explain:{ru:"two weeks ago → Past Simple. buy — неправильный: bought.",ua:"two weeks ago → Past Simple. buy — неправильне: bought.",en:"“Two weeks ago” → past simple. Irregular verb: bought."}},{type:"gap",id:"u2w5",before:"We",after:"a great time at the party on Saturday. (have)",answer:["had"],explain:{ru:"on Saturday (прошлая) → Past Simple. have → had.",ua:"on Saturday (минула) → Past Simple. have → had.",en:"“On Saturday” (finished) → past simple. have → had."}},{type:"gap",id:"u2w6",before:"He",after:"three letters this morning. (write)",answer:["wrote"],explain:{ru:"this morning (утро уже прошло) → Past Simple. write → wrote.",ua:"this morning (ранок уже минув) → Past Simple. write → wrote.",en:"“This morning” (finished) → past simple. write → wrote."}},{type:"match",id:"u2w7",left:["go","see","buy","write"],right:["went","saw","bought","wrote"],pairs:[[0,0],[1,1],[2,2],[3,3]],explain:{ru:"Неправильные глаголы в Past Simple: go → went, see → saw, buy → bought, write → wrote.",ua:"Неправильні дієслова в Past Simple: go → went, see → saw, buy → bought, write → wrote.",en:"Irregular past simple forms: go → went, see → saw, buy → bought, write → wrote."}}]},{id:"u2-core",title:{ru:'Практика: прошлое время и "used to"',ua:'Практика: минулий час і "used to"',en:'Core practice: past simple and "used to"'},level:"core",items:[{type:"choice",id:"u2c1",question:"I ______ him at the airport yesterday.",options:["met","meet","meeted","meeting"],correct:"met",explain:{ru:"yesterday → Past Simple. meet → met (неправильный глагол, формы meeded нет).",ua:"yesterday → Past Simple. meet → met (неправильне дієслово, форми meeded немає).",en:"“Yesterday” → past simple. meet → met (irregular; “meeted” does not exist)."}},{type:"gap",id:"u2c2",before:"Where",after:"born? In Kharkiv. (you be)",answer:["were you born"],explain:{ru:"Вопрос о рождении — устойчивый оборот: Where were you born?",ua:"Питання про народження — стійкий вислів: Where were you born?",en:"Asking about birth — a fixed phrase: Where were you born?"}},{type:"gap",id:"u2c3",before:"My grandpa",after:"in a small village. Now he lives in town. (use to live)",answer:["used to live"],explain:{ru:"Раньше жил в деревне, теперь нет → used to + live.",ua:"Раніше жив у селі, тепер ні → used to + live.",en:"He lived there before, but not now → used to + live."}},{type:"choice",id:"u2c4",question:"Did she ______ her homework yesterday evening?",options:["do","did","done","does"],correct:"do",explain:{ru:"После Did глагол в начальной форме → do. ❌ Did she did/done.",ua:"Після Did дієслово в початковій формі → do. ❌ Did she did/done.",en:"After “Did” the verb is in the base form → do. ❌ Did she did/done."}},{type:"gap",id:"u2c5",before:"We",after:"the match because the TV was broken. (not watch)",answer:["didn't watch","did not watch"],explain:{ru:"Причина в прошлом (was broken) → Past Simple: didn't watch.",ua:"Причина в минулому (was broken) → Past Simple: didn't watch.",en:"The reason is in the past (was broken) → past simple: didn't watch."}},{type:"choice",id:"u2c6",question:"She ______ to school by bus every day when she was little.",options:["used to go","uses to go","is used to go","use to go"],correct:"used to go",explain:{ru:"Привычка из детства, которой больше нет → used to + go.",ua:"Звичка з дитинства, якої більше немає → used to + go.",en:"A childhood habit that has ended → used to + go."}},{type:"gap",id:"u2c7",before:"I",after:"nothing this morning, so I am very hungry now. (eat)",answer:["ate"],explain:{ru:"this morning уже завершено → Past Simple. eat → ate.",ua:"this morning уже завершено → Past Simple. eat → ate.",en:"“This morning” is finished → past simple. eat → ate."}},{type:"transform",id:"u2c8",instruction:{ru:"Сделай предложение отрицательным:",ua:"Зроби речення заперечним:",en:"Make the sentence negative:"},source:"He broke the window.",answer:["He didn't break the window","He did not break the window"],explain:{ru:"didn't + начальная форма. broke возвращается в break → He didn't break the window.",ua:"didn't + початкова форма. broke повертається в break → He didn't break the window.",en:"didn't + base form. broke goes back to break → He didn't break the window."}}]},{id:"u2-challenge",title:{ru:"Вызов: мыслим прошедшим временем",ua:"Виклик: мислимо минулим часом",en:"Challenge: thinking in the past"},level:"challenge",items:[{type:"build",id:"u2h1",words:["last night","to bed","went","very late","I"],answer:"I went to bed very late last night",explain:{ru:"Порядок слов: I went to bed very late last night (маркер last night в конце).",ua:"Порядок слів: I went to bed very late last night (маркер last night наприкінці).",en:"Word order: I went to bed very late last night (time marker at the end)."}},{type:"gap",id:"u2h2",before:"When I was a child, I",after:"vegetables at all. Now I love them! (not like)",answer:["didn't use to like","did not use to like"],explain:{ru:"Отрицание с used to: didn't use to + like (форма use не меняется).",ua:"Заперечення з used to: didn't use to + like (форма use не змінюється).",en:"Negative with used to: didn't use to + like (the form “use” stays the same)."}},{type:"transform",id:"u2h3",instruction:{ru:"Перепиши предложение с used to:",ua:"Перепиши речення з used to:",en:'Rewrite the sentence with "used to":'},source:"I played tennis every weekend, but now I do not.",answer:["I used to play tennis every weekend"],explain:{ru:"Привычка в прошлом → I used to play tennis every weekend.",ua:"Звичка в минулому → I used to play tennis every weekend.",en:"A past habit → I used to play tennis every weekend."}},{type:"choice",id:"u2h4",question:"______ a lot of snow last winter?",options:["Was there","There was","There were","Is there"],correct:"Was there",explain:{ru:"Вопрос с there was/were: Was there + ...? snow — неисчисляемое, was.",ua:"Питання з there was/were: Was there + ...? snow — незлічуване, was.",en:"Question with there was/were: Was there + ...? Snow is uncountable → was."}},{type:"gap",id:"u2h5",before:"We",after:"to the Highlands. The journey took six hours. (drive)",answer:["drove"],explain:{ru:"Рассказ о прошлом путешествии → Past Simple. drive → drove.",ua:"Розповідь про минулу подорож → Past Simple. drive → drove.",en:"A story about a past journey → past simple. drive → drove."}}]}]},Kv={id:3,title:{en:"Past Continuous",ru:"Past Continuous",ua:"Past Continuous"},color:"#1F9540",colorSoft:"#DFF2E3",theory:[{heading:{ru:"Past Continuous: действие в процессе в прошлом",ua:"Past Continuous: дія в процесі в минулому",en:"Past Continuous: an action in progress in the past"},body:{ru:`Это прошедшее продолженное время: действие длилось в определённый момент в прошлом. Форма: was / were + глагол с -ing.
Примеры: I was sleeping at midnight. They were driving to Glasgow all evening.`,ua:`Це минулий тривалий час: дія тривала в певний момент у минулому. Форма: was / were + дієслово з -ing.
Приклади: I was sleeping at midnight. They were driving to Glasgow all evening.`,en:`The past continuous shows an action that was in progress at a moment in the past. Form: was / were + verb-ing.
Examples: I was sleeping at midnight. They were driving to Glasgow all evening.`},table:{head:["","Утверждение","Отрицание","Вопрос"],rows:[["I / He / She / It","was working","wasn't working","Was she working?"],["You / We / They","were working","weren't working","Were they working?"]]},note:{ru:"Маркеры: at 8 o'clock yesterday, at that moment, all evening, while, when. Правила написания -ing те же, что в Present Continuous: run → running, travel → travelling.",ua:"Маркери: at 8 o'clock yesterday, at that moment, all evening, while, when. Правила написання -ing ті самі, що в Present Continuous: run → running, travel → travelling.",en:"Markers: at 8 o'clock yesterday, at that moment, all evening, while, when. The -ing spelling rules are the same as in the present continuous: run → running, travel → travelling."}},{heading:{ru:"Два действия в прошлом: when и while",ua:"Дві дії в минулому: when і while",en:"Two past actions: when and while"},body:{ru:`Когда длинное действие «фон» прерывается коротким, мы используем:
Past Continuous (длинное) + when + Past Simple (короткое): I was cooking when the phone rang.
while + Past Continuous (два действия параллельно): While I was reading, my brother was playing.
Короткое действие (Past Simple) — это событие: rang, arrived, started. Длинное (Past Continuous) — процесс: was cooking, was reading.`,ua:`Коли довга дія «фон» переривається короткою, ми використовуємо:
Past Continuous (довга) + when + Past Simple (коротка): I was cooking when the phone rang.
while + Past Continuous (дії паралельно): While I was reading, my brother was playing.
Коротка дія (Past Simple) — це подія: rang, arrived, started. Довга (Past Continuous) — процес: was cooking, was reading.`,en:`When a long “background” action is interrupted by a short one, we use:
Past continuous (long) + when + past simple (short): I was cooking when the phone rang.
while + past continuous (two parallel actions): While I was reading, my brother was playing.
The short action (past simple) is an event: rang, arrived, started. The long one (past continuous) is a process: was cooking, was reading.`},table:{head:["Схема","Пример"],rows:[["Past Continuous + when + Past Simple","She was driving when it started to snow."],["Past Simple + while + Past Continuous","I met Tom while I was walking the dog."],["while + Past Continuous, + Past Continuous","While he was cooking, she was setting the table."]]},note:{ru:"❌ When I was arriving, it rained. ✅ When I arrived, it started to rain. arrive — короткое событие, не процесс.",ua:"❌ When I was arriving, it rained. ✅ When I arrived, it started to rain. arrive — коротка подія, не процес.",en:"❌ When I was arriving, it rained. ✅ When I arrived, it started to rain. “Arrive” is a short event, not a process."}}],exercises:[{id:"u3-warmup",title:{ru:"Разминка: формы Past Continuous",ua:"Розминка: форми Past Continuous",en:"Warm-up: past continuous forms"},level:"warmup",items:[{type:"gap",id:"u3w1",before:"I",after:"at midnight yesterday. (sleep)",answer:["was sleeping"],explain:{ru:"Действие в процессе в прошлый момент (at midnight yesterday) → was sleeping.",ua:"Дія в процесі в минулий момент (at midnight yesterday) → was sleeping.",en:"An action in progress at a past moment (at midnight yesterday) → was sleeping."}},{type:"gap",id:"u3w2",before:"They",after:"to the teacher at that moment. (not listen)",answer:["weren't listening","were not listening"],explain:{ru:"they → were. Отрицание: weren't + listening.",ua:"they → were. Заперечення: weren't + listening.",en:"they → were. Negative: weren't + listening."}},{type:"gap",id:"u3w3",before:"",after:"when you left home this morning? (it rain)",answer:["was it raining"],explain:{ru:"Действие в процессе, когда случилось событие → Was it raining?",ua:"Дія в процесі, коли сталася подія → Was it raining?",en:"An action in progress when an event happened → Was it raining?"}},{type:"gap",id:"u3w4",before:"She",after:"too fast when the police stopped her. (drive)",answer:["was driving"],explain:{ru:"Длинный процесс (was driving), прерванный событием (stopped) → was driving.",ua:"Довгий процес (was driving), перерваний подією (stopped) → was driving.",en:"A long process (was driving) interrupted by an event (stopped) → was driving."}},{type:"gap",id:"u3w5",before:"We",after:"dinner at eight o'clock yesterday. (have)",answer:["were having"],explain:{ru:"at eight o'clock yesterday — момент в прошлом → were having.",ua:"at eight o'clock yesterday — момент у минулому → were having.",en:"“At eight o'clock yesterday” — a past moment → were having."}},{type:"gap",id:"u3w6",before:"The sun",after:"and the birds were singing. (shine)",answer:["was shining"],explain:{ru:"Параллельные процессы: was shining ... were singing.",ua:"Паралельні процеси: was shining ... were singing.",en:"Parallel processes: was shining ... were singing."}},{type:"match",id:"u3w7",left:["run","write","swim","open"],right:["running","writing","swimming","opening"],pairs:[[0,0],[1,1],[2,2],[3,3]],explain:{ru:"run и swim — удваиваем согласную (краткий ударный слог), write — убираем -e, open — просто добавляем -ing.",ua:"run і swim — подвоюємо приголосну (короткий наголошений склад), write — прибираємо -e, open — просто додаємо -ing.",en:"run and swim double the consonant (short stressed syllable), write drops the -e, open just adds -ing."}}]},{id:"u3-core",title:{ru:"Практика: when, while и фоновые действия",ua:"Практика: when, while і фонові дії",en:"Core practice: when, while and background actions"},level:"core",intro:{ru:"Длинное действие (Continuous) или короткое событие (Simple)?",ua:"Довга дія (Continuous) чи коротка подія (Simple)?",en:"Long action (continuous) or short event (simple)?"},items:[{type:"choice",id:"u3c1",question:"When I arrived, they ______ dinner.",options:["were having","had","have","are having"],correct:"were having",explain:{ru:"Действие в процессе в момент события → were having.",ua:"Дія в процесі в момент події → were having.",en:"An action in progress at the moment of the event → were having."}},{type:"gap",id:"u3c2",before:"While I",after:"home, it suddenly started to rain. (walk)",answer:["was walking"],explain:{ru:"while + длинное действие → was walking. started — короткое событие.",ua:"while + довга дія → was walking. started — коротка подія.",en:"while + long action → was walking. “Started” is the short event."}},{type:"choice",id:"u3c3",question:'"______ when the accident happened?" "I was waiting for a bus."',options:["What were you doing","What did you do","What you were doing","What do you do"],correct:"What were you doing",explain:{ru:"Вопрос о процессе в прошлом: What were you doing? (инверсия обязательна).",ua:"Питання про процес у минулому: What were you doing? (інверсія обов'язкова).",en:"Asking about a past process: What were you doing? (inversion is required)."}},{type:"gap",id:"u3c4",before:"He broke his leg while he",after:". (ski)",answer:["was skiing"],explain:{ru:"Процесс в момент события → was skiing. ski → skiing (удвоение i не нужно).",ua:"Процес в момент події → was skiing. ski → skiing (подвоєння i не потрібне).",en:"A process at the moment of the event → was skiing. ski → skiing (no doubling needed)."}},{type:"gap",id:"u3c5",before:"I",after:"an old friend while I was doing the shopping. (see)",answer:["saw"],explain:{ru:"Встретить — короткое событие, а не процесс → saw (Past Simple).",ua:"Зустріти — коротка подія, а не процес → saw (Past Simple).",en:"Seeing a friend is a short event, not a process → saw (past simple)."}},{type:"choice",id:"u3c6",question:"At nine o'clock last night I ______ a book.",options:["was reading","read","am reading","reading"],correct:"was reading",explain:{ru:"Конкретный момент в прошлом (at nine last night) → was reading.",ua:"Конкретний момент у минулому (at nine last night) → was reading.",en:"A specific past moment (at nine last night) → was reading."}},{type:"gap",id:"u3c7",before:"They",after:"attention, so they missed the announcement. (not pay)",answer:["weren't paying","were not paying"],explain:{ru:"Не обращали внимание — процесс, который привёл к результату → weren't paying.",ua:"Не звертали уваги — процес, що призвів до результату → weren't paying.",en:"Not paying attention — a process that led to a result → weren't paying."}},{type:"transform",id:"u3c8",instruction:{ru:"Соедини предложения в одно, используя while:",ua:"З'єднай речення в одне, використовуючи while:",en:'Join the sentences into one using "while":'},source:"She was cooking dinner. He was watching TV.",answer:["While she was cooking dinner, he was watching TV","He was watching TV while she was cooking dinner"],explain:{ru:"Два параллельных процесса соединяем через while: While she was cooking dinner, he was watching TV.",ua:"Два паралельні процеси з'єднуємо через while: While she was cooking dinner, he was watching TV.",en:"Two parallel processes joined with while: While she was cooking dinner, he was watching TV."}}]},{id:"u3-challenge",title:{ru:"Вызов: истории из прошлого",ua:"Виклик: історії з минулого",en:"Challenge: stories from the past"},level:"challenge",items:[{type:"build",id:"u3h1",words:["was","at 7 am","having a shower","I","this morning"],answer:"I was having a shower at 7 am this morning",explain:{ru:"Порядок: подлежащее + was having + объект + время: I was having a shower at 7 am this morning.",ua:"Порядок: підмет + was having + об'єкт + час: I was having a shower at 7 am this morning.",en:"Order: subject + was having + object + time: I was having a shower at 7 am this morning."}},{type:"gap",id:"u3h2",before:"The plane",after:"when suddenly one of the engines failed. (take off)",answer:["was taking off"],explain:{ru:"Длинное действие прервано событием → was taking off.",ua:"Довга дія перервана подією → was taking off.",en:"A long action interrupted by an event → was taking off."}},{type:"choice",id:"u3h3",question:"I ______ my keys while I was running to the bus stop.",options:["lost","was losing","lose","am losing"],correct:"lost",explain:{ru:"Потерять ключи — мгновенное событие внутри процесса → lost (Past Simple).",ua:"Втратити ключі — миттєва подія всередині процесу → lost (Past Simple).",en:"Losing the keys is an instant event inside a process → lost (past simple)."}},{type:"transform",id:"u3h4",instruction:{ru:"Задай вопрос к выделенной ситуации:",ua:"Постав питання до виділеної ситуації:",en:"Ask a question about the situation:"},source:"She was wearing a red coat yesterday.",answer:["Was she wearing a red coat yesterday"],explain:{ru:"Вопрос в Past Continuous: Was + she + wearing...?",ua:"Питання в Past Continuous: Was + she + wearing...?",en:"Past continuous question: Was + she + wearing...?"}},{type:"gap",id:"u3h5",before:"What",after:"at this time yesterday? I can't remember. (you do)",answer:["were you doing"],explain:{ru:"at this time yesterday — процесс в прошлом → were you doing.",ua:"at this time yesterday — процес у минулому → were you doing.",en:"“At this time yesterday” — a past process → were you doing."}}]}]},Jv={id:4,title:{en:"Present Perfect",ru:"Present Perfect",ua:"Present Perfect"},color:"#4788ED",colorSoft:"#E1EBFD",theory:[{heading:{ru:"Present Perfect: прошлое, связанное с настоящим",ua:"Present Perfect: минуле, пов'язане з теперішнім",en:"Present Perfect: the past connected to now"},body:{ru:`Это настоящее совершенное время: действие было в прошлом, но важен его результат сейчас. Форма: have / has + третья форма глагола (V3).
Примеры: I have lost my keys. (потерял — и сейчас их нет) She has broken her leg. (сломала — и сейчас нога в гипсе)`,ua:`Це теперішній доконаний час: дія була в минулому, але важливий її результат зараз. Форма: have / has + третя форма дієслова (V3).
Приклади: I have lost my keys. (загубив — і зараз їх немає) She has broken her leg. (зламала — і зараз нога в гіпсі)`,en:`The present perfect connects the past to now: the action happened in the past, but the result matters now. Form: have / has + the third form of the verb (V3).
Examples: I have lost my keys. (lost — and I still can't find them) She has broken her leg. (broken — and the leg is still in plaster)`},table:{head:["","Утверждение","Отрицание","Вопрос"],rows:[["I / You / We / They","have worked","haven't worked","Have you worked?"],["He / She / It","has worked","hasn't worked","Has she worked?"]]},note:{ru:"Третья форма правильных глаголов = -ed (worked); неправильных — из таблицы: see → seen, eat → eaten, go → gone/been, buy → bought.",ua:"Третя форма правильних дієслів = -ed (worked); неправильних — з таблиці: see → seen, eat → eaten, go → gone/been, buy → bought.",en:"V3 of regular verbs = -ed (worked); irregular verbs come from the table: see → seen, eat → eaten, go → gone/been, buy → bought."}},{heading:{ru:"Ключевые слова: just, already, yet, ever, never",ua:"Ключові слова: just, already, yet, ever, never",en:"Key words: just, already, yet, ever, never"},body:{ru:`just — «только что»: I have just eaten. (едва успел, результат свежий)
already — «уже» (в утверждении и вопросе): She has already left.
yet — «ещё» (в отрицании и вопросе, в конце): I haven't finished yet. Have you finished yet?
ever — «когда-либо» (вопрос): Have you ever been to Scotland?
never — «никогда» (между have и V3): I have never eaten oysters.`,ua:`just — «щойно»: I have just eaten. (ледве встиг, результат свіжий)
already — «вже» (в ствердженні і питанні): She has already left.
yet — «ще» (в запереченні і питанні, наприкінці): I haven't finished yet. Have you finished yet?
ever — «коли-небудь» (питання): Have you ever been to Scotland?
never — «ніколи» (між have і V3): I have never eaten oysters.`,en:`just — “a moment ago”: I have just eaten.
already — “by now” (in statements and questions): She has already left.
yet — “so far” (in negatives and questions, at the end): I haven't finished yet. Have you finished yet?
ever — “at any time” (questions): Have you ever been to Scotland?
never — “not at any time” (between have and V3): I have never eaten oysters.`},note:{ru:"ever и never НЕ работают с Past Simple: ❌ Did you ever seen...? ✅ Have you ever seen...?",ua:"ever і never НЕ працюють з Past Simple: ❌ Did you ever seen...? ✅ Have you ever seen...?",en:"ever and never do NOT work with the past simple: ❌ Did you ever seen...? ✅ Have you ever seen...?"}},{heading:{ru:"Present Perfect vs Past Simple — главное различие",ua:"Present Perfect vs Past Simple — головна відмінність",en:"Present Perfect vs Past Simple — the key difference"},body:{ru:`Past Simple отвечает на вопрос «КОГДА?» — время указано: I saw him yesterday. Present Perfect говорит о РЕЗУЛЬТАТЕ, время не уточняется: I have seen him. (неважно когда)
Поэтому: ❌ I have seen him yesterday. ✅ I saw him yesterday.
for + период (for two years), since + точка (since 2020) — только с Present Perfect: We have lived here since 2018.`,ua:`Past Simple відповідає на питання «КОЛИ?» — час зазначено: I saw him yesterday. Present Perfect говорить про РЕЗУЛЬТАТ, час не уточнюється: I have seen him. (неважливо коли)
Тому: ❌ I have seen him yesterday. ✅ I saw him yesterday.
for + період (for two years), since + точка (since 2020) — тільки з Present Perfect: We have lived here since 2018.`,en:`The past simple answers “WHEN?” — the time is given: I saw him yesterday. The present perfect is about the RESULT, with no exact time: I have seen him. (when does not matter)
So: ❌ I have seen him yesterday. ✅ I saw him yesterday.
for + a period (for two years), since + a starting point (since 2020) — only with the present perfect: We have lived here since 2018.`},table:{head:["Present Perfect (результат)","Past Simple (время указано)"],rows:[["I have lost my keys. (их нет сейчас)","I lost my keys yesterday. (когда — вчера)"],["She has been to Italy. (опыт)","She went to Italy in 2019. (конкретный год)"]]},note:{ru:"been vs gone: He has been to Paris. (был и вернулся) He has gone to Paris. (уехал и ещё там).",ua:"been vs gone: He has been to Paris. (був і повернувся) He has gone to Paris. (поїхав і досі там).",en:"been vs gone: He has been to Paris. (went and came back) He has gone to Paris. (went and is still there)."}}],exercises:[{id:"u4-warmup",title:{ru:"Разминка: формы Present Perfect",ua:"Розминка: форми Present Perfect",en:"Warm-up: present perfect forms"},level:"warmup",items:[{type:"gap",id:"u4w1",before:"I",after:"my homework. (just finish)",answer:["have just finished"],explain:{ru:"just → Present Perfect: have just + V3 → have just finished.",ua:"just → Present Perfect: have just + V3 → have just finished.",en:"“Just” → present perfect: have just + V3 → have just finished."}},{type:"gap",id:"u4w2",before:"She",after:"the sea. She really wants to go to the coast. (never see)",answer:["has never seen"],explain:{ru:"never встает между has и V3: has never seen.",ua:"never стає між has і V3: has never seen.",en:"“Never” goes between has and V3: has never seen."}},{type:"gap",id:"u4w3",before:"",after:"sushi? Yes, many times! (you ever eat)",answer:["have you ever eaten"],explain:{ru:"Опыт — вопрос с ever: Have you ever + V3 (eat → eaten)?",ua:"Досвід — питання з ever: Have you ever + V3 (eat → eaten)?",en:"Experience — a question with ever: Have you ever + V3 (eat → eaten)?"}},{type:"gap",id:"u4w4",before:"We",after:"yet. It is a difficult choice. (not decide)",answer:["haven't decided","have not decided"],explain:{ru:"yet в отрицании → Present Perfect: haven't decided.",ua:"yet у зап
