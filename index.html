ереченні → Present Perfect: haven't decided.",en:"“Yet” in a negative → present perfect: haven't decided."}},{type:"gap",id:"u4w5",before:"He",after:"the building. You cannot speak to him now. (already leave)",answer:["has already left"],explain:{ru:"already → has already + V3: has already left (результат — его нет).",ua:"already → has already + V3: has already left (результат — його немає).",en:"“Already” → has already + V3: has already left (the result: he is not here)."}},{type:"gap",id:"u4w6",before:"They",after:"to London twice. They loved it. (be)",answer:["have been"],explain:{ru:"Опыт (twice) + вернулись → have been to.",ua:"Досвід (twice) + повернулися → have been to.",en:"Experience (twice) + they are back → have been to."}},{type:"match",id:"u4w7",left:["I have just eaten.","I haven't finished yet.","She has already left.","Have you ever been to Japan?"],right:["just","yet","already","ever"],pairs:[[0,0],[1,1],[2,2],[3,3]],explain:{ru:"just и already — в середине (между have и V3), yet — в конце отрицания/вопроса, ever — в вопросе.",ua:"just і already — у середині (між have і V3), yet — наприкінці заперечення/питання, ever — у питанні.",en:"“Just” and “already” sit in the middle (between have and V3), “yet” ends negatives and questions, “ever” appears in questions."}}]},{id:"u4-core",title:{ru:"Практика: Perfect или Simple?",ua:"Практика: Perfect чи Simple?",en:"Core practice: perfect or simple?"},level:"core",intro:{ru:"Результат и опыт — Present Perfect. Указано время — Past Simple.",ua:"Результат і досвід — Present Perfect. Зазначено час — Past Simple.",en:"Result and experience → present perfect. Time given → past simple."},items:[{type:"choice",id:"u4c1",question:"I ______ this film three times. I love it!",options:["have seen","saw","see","am seeing"],correct:"have seen",explain:{ru:"Опыт без указания времени → Present Perfect: have seen.",ua:"Досвід без зазначення часу → Present Perfect: have seen.",en:"Experience with no time given → present perfect: have seen."}},{type:"gap",id:"u4c2",before:"I",after:"this film last Friday at the cinema. (see)",answer:["saw"],explain:{ru:"last Friday — время указано → Past Simple: saw.",ua:"last Friday — час зазначено → Past Simple: saw.",en:"“Last Friday” — the time is given → past simple: saw."}},{type:"choice",id:"u4c3",question:"Where is John? He ______ to the shop. He will be back soon.",options:["has gone","has been","went","goes"],correct:"has gone",explain:{ru:"Его нет сейчас (результат) → has gone to (уехал и ещё там).",ua:"Його немає зараз (результат) → has gone to (поїхав і досі там).",en:"He is not here now (result) → has gone to (he left and is still there)."}},{type:"gap",id:"u4c4",before:"We",after:"each other since 2015. We are good friends. (know)",answer:["have known"],explain:{ru:"since + год → Present Perfect: have known (know → known).",ua:"since + рік → Present Perfect: have known (know → known).",en:"“Since” + a year → present perfect: have known (know → known)."}},{type:"choice",id:"u4c5",question:'"______?" "In 2010."',options:["When did you move here","When have you moved here","When you moved here","When do you move here"],correct:"When did you move here",explain:{ru:"Ответ «In 2010» указывает время → Past Simple: When did you move here?",ua:"Відповідь «In 2010» зазначає час → Past Simple: When did you move here?",en:"The answer “In 2010” gives the time → past simple: When did you move here?"}},{type:"gap",id:"u4c6",before:"She",after:"here for ten years. She loves her job. (work)",answer:["has worked","has been working"],explain:{ru:"for + период до настоящего → Present Perfect: has worked.",ua:"for + період до теперішнього → Present Perfect: has worked.",en:"“For” + a period up to now → present perfect: has worked."}},{type:"gap",id:"u4c7",before:"I",after:"my phone. I can't find it anywhere. (lose)",answer:["have lost"],explain:{ru:"Результат сейчас (не могу найти) → Present Perfect: have lost.",ua:"Результат зараз (не можу знайти) → Present Perfect: have lost.",en:"A present result (I can't find it) → present perfect: have lost."}},{type:"transform",id:"u4c8",instruction:{ru:"Сделай предложение отрицательным:",ua:"Зроби речення заперечним:",en:"Make the sentence negative:"},source:"He has eaten all the cake.",answer:["He hasn't eaten all the cake","He has not eaten all the cake"],explain:{ru:"Отрицание: hasn't + V3 → He hasn't eaten all the cake.",ua:"Заперечення: hasn't + V3 → He hasn't eaten all the cake.",en:"Negative: hasn't + V3 → He hasn't eaten all the cake."}}]},{id:"u4-challenge",title:{ru:"Вызов: говорим о результатах",ua:"Виклик: говоримо про результати",en:"Challenge: talking about results"},level:"challenge",items:[{type:"build",id:"u4h1",words:["yet","finished","her project","hasn't","She"],answer:"She hasn't finished her project yet",explain:{ru:"Отрицание с yet: She hasn't finished her project yet (yet — в конце).",ua:"Заперечення з yet: She hasn't finished her project yet (yet — наприкінці).",en:"Negative with yet: She hasn't finished her project yet (yet goes at the end)."}},{type:"gap",id:"u4h2",before:"This is the first time I",after:"a car. I am a bit nervous. (drive)",answer:["have driven"],explain:{ru:"This is the first time + Present Perfect: have driven (drive → driven).",ua:"This is the first time + Present Perfect: have driven (drive → driven).",en:"“This is the first time” + present perfect: have driven (drive → driven)."}},{type:"choice",id:"u4h3",question:'"______?" "Yes, I have been there twice. It is wonderful."',options:["Have you ever been to Paris","Did you ever go to Paris","Do you ever go to Paris","Are you ever in Paris"],correct:"Have you ever been to Paris",explain:{ru:"Вопрос об опыте с ever → Present Perfect: Have you ever been to...?",ua:"Питання про досвід з ever → Present Perfect: Have you ever been to...?",en:"A question about experience with ever → present perfect: Have you ever been to...?"}},{type:"transform",id:"u4h4",instruction:{ru:"Перепиши предложение, добавив already:",ua:"Перепиши речення, додавши already:",en:'Rewrite the sentence adding "already":'},source:"I have finished the report.",answer:["I have already finished the report"],explain:{ru:"already встает между have и V3: I have already finished the report.",ua:"already стає між have і V3: I have already finished the report.",en:"“Already” goes between have and V3: I have already finished the report."}},{type:"gap",id:"u4h5",before:"My parents",after:"married for 25 years. (be)",answer:["have been"],explain:{ru:"for + период + состояние до сих пор → have been.",ua:"for + період + стан досі → have been.",en:"“For” + a period + a state that continues → have been."}}]}]},$v={id:5,title:{en:"Future forms: will, going to, present continuous",ru:"Способы выражения будущего: will, going to, настоящее время",ua:"Способи вираження майбутнього: will, going to, теперішній час"},color:"#12A5A0",colorSoft:"#DDF2F1",theory:[{heading:{ru:"Will: решения на месте и предсказания",ua:"Will: рішення на місці та передбачення",en:"Will: instant decisions and predictions"},body:{ru:`Will + глагол используется для:
1. Решений, принятых в момент речи: "The phone is ringing!" — "I will answer it."
2. Предсказаний на основе мнения (I think, I believe, probably): I think it will rain tomorrow.
3. Обещаний и предложений: I will always love you. I will help you with your bags.`,ua:`Will + дієслово використовується для:
1. Рішень, прийнятих у момент мовлення: "The phone is ringing!" — "I will answer it."
2. Передбачень на основі думки (I think, I believe, probably): I think it will rain tomorrow.
3. Обіцянок і пропозицій: I will always love you. I will help you with your bags.`,en:`Will + verb is used for:
1. Decisions made at the moment of speaking: "The phone is ringing!" — "I will answer it."
2. Predictions based on opinion (I think, I believe, probably): I think it will rain tomorrow.
3. Promises and offers: I will always love you. I will help you with your bags.`},table:{head:["","Утверждение","Отрицание","Вопрос"],rows:[["все лица","will go ('ll go)","won't go","Will you go?"]]},note:{ru:"Краткая форма 'll — после всех местоимений. Отрицание won't = will not.",ua:"Коротка форма 'll — після всіх займенників. Заперечення won't = will not.",en:"The short form 'll follows all pronouns. Negative: won't = will not."}},{heading:{ru:"Be going to: планы и предсказания по фактам",ua:"Be going to: плани та передбачення за фактами",en:"Be going to: plans and evidence-based predictions"},body:{ru:`Be going to + глагол используется для:
1. Планов и намерений, принятых до момента речи: We are going to buy a new car. (мы уже решили)
2. Предсказаний, когда видим доказательства: Look at those black clouds! It is going to rain. (облака — видимое доказательство)`,ua:`Be going to + дієслово використовується для:
1. Планів і намірів, прийнятих до моменту мовлення: We are going to buy a new car. (ми вже вирішили)
2. Передбачень, коли бачимо докази: Look at those black clouds! It is going to rain. (хмари — видимий доказ)`,en:`Be going to + verb is used for:
1. Plans and intentions made before speaking: We are going to buy a new car. (we already decided)
2. Predictions when we can see the evidence: Look at those black clouds! It is going to rain. (the clouds are visible evidence)`},table:{head:["","Форма"],rows:[["I","am going to do"],["He / She / It","is going to do"],["You / We / They","are going to do"]]},note:{ru:"❌ I will to go. ✅ I am going to go. ❌ I am go to buy. ✅ I am going to buy.",ua:"❌ I will to go. ✅ I am going to go. ❌ I am go to buy. ✅ I am going to buy.",en:"❌ I will to go. ✅ I am going to go. ❌ I am go to buy. ✅ I am going to buy."}},{heading:{ru:"Настоящее время для будущего: договорённости и расписания",ua:"Теперішній час для майбутнього: домовленості та розклади",en:"Present tenses for the future: arrangements and timetables"},body:{ru:`Present Continuous — для личных договорённостей (что-то запланировано с другими людьми): I am meeting the dentist at five tomorrow.
Present Simple — для расписаний транспорта и программ: The train leaves at 9.15. The concert starts at eight.`,ua:`Present Continuous — для особистих домовленостей (щось заплановано з іншими людьми): I am meeting the dentist at five tomorrow.
Present Simple — для розкладів транспорту та програм: The train leaves at 9.15. The concert starts at eight.`,en:`Present continuous — for personal arrangements (something planned with other people): I am meeting the dentist at five tomorrow.
Present simple — for transport timetables and programmes: The train leaves at 9.15. The concert starts at eight.`},table:{head:["Ситуация","Форма","Пример"],rows:[["Решение прямо сейчас","will",'"I will answer the door."'],["Намерение / план","be going to",'"We are going to repaint the kitchen."'],["Договорённость (с людьми, время назначено)","Present Continuous",'"I am seeing the doctor at 4."'],["Расписание","Present Simple",'"The flight arrives at 7.30."'],["Предсказание (мнение)","will",'"I think she will pass."'],["Предсказание (по фактам)","be going to",'"It is going to snow."']]}}],exercises:[{id:"u5-warmup",title:{ru:"Разминка: формы будущего времени",ua:"Розминка: форми майбутнього часу",en:"Warm-up: future forms"},level:"warmup",items:[{type:"gap",id:"u5w1",before:"I think it",after:"tomorrow. The sky is already grey. (rain)",answer:["will rain","'ll rain"],explain:{ru:"Предсказание с I think → will rain.",ua:"Передбачення з I think → will rain.",en:"A prediction with “I think” → will rain."}},{type:"gap",id:"u5w2",before:"We",after:"a new sofa next month. We have already chosen it in the shop. (buy)",answer:["are going to buy"],explain:{ru:"Намерение, принятое заранее → are going to buy.",ua:"Намір, прийнятий заздалегідь → are going to buy.",en:"An intention decided earlier → are going to buy."}},{type:"gap",id:"u5w3",before:"I",after:"the dentist at five tomorrow. The appointment is in my diary. (meet)",answer:["am meeting"],explain:{ru:"Договорённость на конкретное время → Present Continuous: am meeting.",ua:"Домовленість на конкретний час → Present Continuous: am meeting.",en:"An arrangement at a fixed time → present continuous: am meeting."}},{type:"gap",id:"u5w4",before:"The train",after:"at 9.15 according to the timetable. (leave)",answer:["leaves"],explain:{ru:"Расписание → Present Simple: leaves.",ua:"Розклад → Present Simple: leaves.",en:"A timetable → present simple: leaves."}},{type:"gap",id:"u5w5",before:'"The phone is ringing!" "Do not worry, I',after:'it." (answer)',answer:["will answer","'ll answer"],explain:{ru:"Решение принято в момент речи → will answer.",ua:"Рішення прийнято у момент мовлення → will answer.",en:"A decision made at the moment of speaking → will answer."}},{type:"gap",id:"u5w6",before:"They",after:"to the party. They told me yesterday that they have other plans. (not come)",answer:["aren't going to come","are not going to come"],explain:{ru:"План, который изменился → are not going to come.",ua:"План, який змінився → are not going to come.",en:"A plan that has changed → are not going to come."}},{type:"match",id:"u5w7",left:["a decision made now","a plan made earlier","a train timetable","a dinner with friends on Friday (booked)"],right:["will","be going to","present simple","present continuous"],pairs:[[0,0],[1,1],[2,2],[3,3]],explain:{ru:"Решение на месте — will, план — be going to, расписание — present simple, договорённость — present continuous.",ua:"Рішення на місці — will, план — be going to, розклад — present simple, домовленість — present continuous.",en:"A decision on the spot → will, a plan → be going to, a timetable → present simple, an arrangement → present continuous."}}]},{id:"u5-core",title:{ru:"Практика: какое будущее выбрать?",ua:"Практика: яке майбутнє обрати?",en:"Core practice: which future is right?"},level:"core",intro:{ru:"Решение прямо сейчас — will. План — going to. Договорённость — Continuous. Расписание — Simple.",ua:"Рішення просто зараз — will. План — going to. Домовленість — Continuous. Розклад — Simple.",en:"Instant decision → will. Plan → going to. Arrangement → continuous. Timetable → simple."},items:[{type:"choice",id:"u5c1",question:"Look at those black clouds! It ______.",options:["is going to rain","will rain","rains","raining"],correct:"is going to rain",explain:{ru:"Видимое доказательство (чёрные тучи) → is going to rain.",ua:"Видимий доказ (чорні хмари) → is going to rain.",en:"Visible evidence (black clouds) → is going to rain."}},{type:"gap",id:"u5c2",before:"I promise I",after:"anyone your secret. (not tell)",answer:["won't tell","will not tell"],explain:{ru:"Обещание → will: won't tell.",ua:"Обіцянка → will: won't tell.",en:"A promise → will: won't tell."}},{type:"choice",id:"u5c3",question:"We ______ dinner with the Smiths on Friday. We booked the restaurant yesterday.",options:["are having","have","will have","having"],correct:"are having",explain:{ru:"Договорённость (booked — всё организовано) → Present Continuous: are having.",ua:"Домовленість (booked — усе організовано) → Present Continuous: are having.",en:"An arrangement (booked — everything is organised) → present continuous: are having."}},{type:"gap",id:"u5c4",before:"I think robots",after:"all the housework in the future. (do)",answer:["will do","'ll do"],explain:{ru:"Предсказание с I think → will do.",ua:"Передбачення з I think → will do.",en:"A prediction with “I think” → will do."}},{type:"choice",id:"u5c5",question:'"I feel terrible." "Do not worry, I ______ you a cup of tea."',options:["will make","am going to make","make","made"],correct:"will make",explain:{ru:"Предложение помощи, решение на месте → will make.",ua:"Пропозиція допомоги, рішення на місці → will make.",en:"An offer of help, decided on the spot → will make."}},{type:"gap",id:"u5c6",before:"He",after:"to Berlin next Tuesday. His ticket is already on the table. (fly)",answer:["is flying"],explain:{ru:"Билет куплен = договорённость → is flying.",ua:"Квиток куплено = домовленість → is flying.",en:"The ticket is bought = an arrangement → is flying."}},{type:"transform",id:"u5c7",instruction:{ru:"Перепиши как спонтанное решение с will:",ua:"Перепиши як спонтанне рішення з will:",en:'Rewrite as a spontaneous decision with "will":'},source:"It is hot in here. I am going to open the window.",answer:["It is hot in here. I will open the window","I will open the window"],explain:{ru:"Решение принято прямо сейчас → I will open the window.",ua:"Рішення прийнято просто зараз → I will open the window.",en:"A decision made right now → I will open the window."}},{type:"gap",id:"u5c8",before:"My plane",after:"at 6.30 in the morning. (arrive)",answer:["arrives"],explain:{ru:"Расписание транспорта → Present Simple: arrives.",ua:"Розклад транспорту → Present Simple: arrives.",en:"A transport timetable → present simple: arrives."}}]},{id:"u5-challenge",title:{ru:"Вызов: истории о будущем",ua:"Виклик: історії про майбутнє",en:"Challenge: stories about the future"},level:"challenge",items:[{type:"build",id:"u5h1",words:["at the clouds","going to rain","Look","it is"],answer:"Look at the clouds, it is going to rain",explain:{ru:"Видимое доказательство → Look at the clouds, it is going to rain.",ua:"Видимий доказ → Look at the clouds, it is going to rain.",en:"Visible evidence → Look at the clouds, it is going to rain."}},{type:"gap",id:"u5h2",before:"By 2050, people",after:"on Mars. I am sure of it! (live)",answer:["will live","'ll live"],explain:{ru:"Далёкое предсказание по мнению → will live.",ua:"Далеке передбачення на думку → will live.",en:"A distant opinion-based prediction → will live."}},{type:"choice",id:"u5h3",question:"Watch out! You ______ your glass!",options:["are going to drop","will drop","drop","are dropping"],correct:"are going to drop",explain:{ru:"Стакан уже падает — доказательство перед глазами → are going to drop.",ua:"Склянка вже падає — доказ перед очима → are going to drop.",en:"The glass is already falling — the evidence is right there → are going to drop."}},{type:"transform",id:"u5h4",instruction:{ru:"Задай вопрос о предсказании:",ua:"Постав питання про передбачення:",en:"Ask a question about the prediction:"},source:"She will pass the exam.",answer:["Will she pass the exam"],explain:{ru:"Вопрос с will: Will + she + pass...?",ua:"Питання з will: Will + she + pass...?",en:"A will-question: Will + she + pass...?"}},{type:"gap",id:"u5h5",before:"We",after:"a musical tonight — we have had the tickets for weeks. (see)",answer:["are seeing"],explain:{ru:"Билеты куплены давно = договорённость → are seeing.",ua:"Квитки куплено давно = домовленість → are seeing.",en:"Tickets bought long ago = an arrangement → are seeing."}}]}]},ew={id:6,title:{en:"Relative clauses (who, which, that, whose, where)",ru:"Определительные придаточные предложения",ua:"Означувальні підрядні речення"},color:"#7B5EA7",colorSoft:"#EAE4F5",theory:[{heading:{ru:"Что такое придаточное определительное",ua:"Що таке означувальне підрядне",en:"What a relative clause is"},body:{ru:`Придаточное определительное даёт информацию о существительном и начинается с относительного слова: who (о людях), which (о вещах и животных), that (о людях и вещах — в разговорной речи).
Примеры: The girl who lives next door is a dancer. This is the book which I bought yesterday. (или: the book that I bought)`,ua:`Означувальне підрядне дає інформацію про іменник і починається з відносного слова: who (про людей), which (про речі та тварин), that (про людей і речі — у розмовній мові).
Приклади: The girl who lives next door is a dancer. This is the book which I bought yesterday. (або: the book that I bought)`,en:`A relative clause gives information about a noun and starts with a relative word: who (for people), which (for things and animals), that (for both — common in speech).
Examples: The girl who lives next door is a dancer. This is the book which I bought yesterday. (or: the book that I bought)`},table:{head:["Относительное слово","О чём","Пример"],rows:[["who","люди","The man who called you is my uncle."],["which","вещи, животные","The car which is parked outside is mine."],["that","люди и вещи (разговорное)","The film that we saw was great."]]},note:{ru:"❌ The girl which lives... ✅ The girl who lives... ❌ the book who I read ✅ the book which/that I read.",ua:"❌ The girl which lives... ✅ The girl who lives... ❌ the book who I read ✅ the book which/that I read.",en:"❌ The girl which lives... ✅ The girl who lives... ❌ the book who I read ✅ the book which/that I read."}},{heading:{ru:"Whose, where и пропуск относительного слова",ua:"Whose, where і пропуск відносного слова",en:"Whose, where, and dropping the relative word"},body:{ru:`whose = чей, принадлежность (вместо his/her/their): That is the woman whose son won the prize.
where = место: This is the house where I grew up.
Если относительное слово — дополнение (не подлежащее), его часто опускают: This is the book (that) I bought. = The book I bought.
Но если оно подлежащее — опустить нельзя: The girl who called is here. (who нельзя убрать)`,ua:`whose = чий, належність (замість his/her/their): That is the woman whose son won the prize.
where = місце: This is the house where I grew up.
Якщо відносне слово — додаток (не підмет), його часто пропускають: This is the book (that) I bought. = The book I bought.
Але якщо воно підмет — пропустити не можна: The girl who called is here. (who не можна прибрати)`,en:`whose = possession (instead of his/her/their): That is the woman whose son won the prize.
where = places: This is the house where I grew up.
When the relative word is an object, we often drop it: This is the book (that) I bought. = The book I bought.
But when it is the subject, we cannot drop it: The girl who called is here. (who must stay)`},table:{head:["Можно опустить","Нельзя опустить"],rows:[["The film (which) we watched was long.","The film which was on TV was long."],["The man (that) I met was kind.","The man who called me was kind."]]},note:{ru:"После запятой (неопределительные придаточные) that НЕ используем — только which/who: My brother, who lives in Rome, is a chef.",ua:"Після коми (неозначувальні підрядні) that НЕ використовуємо — лише which/who: My brother, who lives in Rome, is a chef.",en:"After a comma (non-defining clauses) we do NOT use “that” — only which/who: My brother, who lives in Rome, is a chef."}}],exercises:[{id:"u6-warmup",title:{ru:"Разминка: who или which?",ua:"Розминка: who чи which?",en:"Warm-up: who or which?"},level:"warmup",items:[{type:"gap",id:"u6w1",before:"The boy",after:"won the match is only twelve. (who/which)",answer:["who"],explain:{ru:"Речь о мальчике (человек) → who.",ua:"Мова про хлопця (людина) → who.",en:"About a boy (a person) → who."}},{type:"gap",id:"u6w2",before:"This is the phone",after:"I told you about. (who/which)",answer:["which"],explain:{ru:"Речь о вещи (телефон) → which. Относительное слово здесь дополнение — его можно опустить.",ua:"Мова про річ (телефон) → which. Відносне слово тут додаток — його можна пропустити.",en:"About a thing (a phone) → which. It is an object here, so it can be dropped."}},{type:"gap",id:"u6w3",before:"The woman",after:"dog barks all night lives upstairs. (whose/who)",answer:["whose"],explain:{ru:"Нужна принадлежность «чья собака» → whose + существительное.",ua:"Потрібна належність «чий собака» → whose + іменник.",en:"We need possession (“her dog”) → whose + noun."}},{type:"gap",id:"u6w4",before:"That is the shop",after:"I bought my bike. (where/which)",answer:["where","in which"],explain:{ru:"Речь о месте → where (= in which).",ua:"Мова про місце → where (= in which).",en:"About a place → where (= in which)."}},{type:"gap",id:"u6w5",before:"The students",after:"study hard usually pass the exams. (which/who)",answer:["who"],explain:{ru:"Студенты — люди → who. Здесь who подлежащее, опустить нельзя.",ua:"Студенти — люди → who. Тут who підмет, пропустити не можна.",en:"Students are people → who. Here who is the subject, so it cannot be dropped."}},{type:"gap",id:"u6w6",before:"I love films",after:"make me laugh. (that/what)",answer:["that","which"],explain:{ru:"Фильмы — вещи; what как относительное слово не используется → that/which.",ua:"Фільми — речі; what як відносне слово не використовується → that/which.",en:"Films are things; we never use “what” as a relative word → that/which."}},{type:"match",id:"u6w7",left:["people","things and animals","possession","places"],right:["who","which","whose","where"],pairs:[[0,0],[1,1],[2,2],[3,3]],explain:{ru:"who — люди, which — вещи, whose — принадлежность, where — места.",ua:"who — люди, which — речі, whose — належність, where — місця.",en:"who — people, which — things, whose — possession, where — places."}}]},{id:"u6-core",title:{ru:"Практика: соединяем предложения",ua:"Практика: з'єднуємо речення",en:"Core practice: joining sentences"},level:"core",items:[{type:"choice",id:"u6c1",question:"The doctor ______ examined me was very kind.",options:["who","which","whose","where"],correct:"who",explain:{ru:"Доктор — человек → who.",ua:"Лікар — людина → who.",en:"A doctor is a person → who."}},{type:"gap",id:"u6c2",before:"The park,",after:"is near my house, is full of flowers in spring. (which/that)",answer:["which"],explain:{ru:"После запятой (неопределительное придаточное) только which — that нельзя.",ua:"Після коми (неозначувальне підрядне) лише which — that не можна.",en:"After a comma (non-defining clause) only which is allowed — not that."}},{type:"transform",id:"u6c3",instruction:{ru:"Соедини два предложения в одно, используя who:",ua:"З'єднай два речення в одне, використовуючи who:",en:'Join the two sentences into one using "who":'},source:"I met a girl. She speaks five languages.",answer:["I met a girl who speaks five languages"],explain:{ru:"She = the girl (человек) → who: I met a girl who speaks five languages.",ua:"She = the girl (людина) → who: I met a girl who speaks five languages.",en:"She = the girl (a person) → who: I met a girl who speaks five languages."}},{type:"choice",id:"u6c4",question:"This is the letter ______ I received yesterday.",options:["(nothing — it can be dropped)","who","whose","where"],correct:"(nothing — it can be dropped)",explain:{ru:"Относительное слово — дополнение (I received the letter), поэтому which/that можно опустить.",ua:"Відносне слово — додаток (I received the letter), тому which/that можна пропустити.",en:"The relative word is an object (I received the letter), so which/that can be dropped."}},{type:"gap",id:"u6c5",before:"Do you know the man",after:"car is parked in front of our house? (who/whose)",answer:["whose"],explain:{ru:"«Чья машина» → whose + car.",ua:"«Чия машина» → whose + car.",en:"“Whose car” → whose + car."}},{type:"transform",id:"u6c6",instruction:{ru:"Соедини два предложения, используя which:",ua:"З'єднай два речення, використовуючи which:",en:'Join the two sentences using "which":'},source:"She bought a dress. The dress was very expensive.",answer:["She bought a dress which was very expensive","She bought a dress that was very expensive"],explain:{ru:"The dress — вещь → which/that: She bought a dress which was very expensive.",ua:"The dress — річ → which/that: She bought a dress which was very expensive.",en:"The dress is a thing → which/that: She bought a dress which was very expensive."}},{type:"choice",id:"u6c7",question:"My grandparents, ______ live in the countryside, are both over eighty.",options:["who","that","which","where"],correct:"who",explain:{ru:"После запятой о людях — только who (that запрещён).",ua:"Після коми про людей — лише who (that заборонено).",en:"After a comma, for people — only who (that is not allowed)."}},{type:"gap",id:"u6c8",before:"That was the summer",after:"we first met. (when/where)",answer:["when"],explain:{ru:"О времени → when (the summer when we first met).",ua:"Про час → when (the summer when we first met).",en:"About time → when (the summer when we first met)."}}]},{id:"u6-challenge",title:{ru:"Вызов: говорим сложнее",ua:"Виклик: говоримо складніше",en:"Challenge: speaking in longer sentences"},level:"challenge",items:[{type:"build",id:"u6h1",words:["who","The actor","plays James Bond","is British"],answer:"The actor who plays James Bond is British",explain:{ru:"The actor (человек) + who + глагол: The actor who plays James Bond is British.",ua:"The actor (людина) + who + дієслово: The actor who plays James Bond is British.",en:"The actor (a person) + who + verb: The actor who plays James Bond is British."}},{type:"gap",id:"u6h2",before:"The house",after:"roof was damaged in the storm belongs to my aunt. (who/whose)",answer:["whose"],explain:{ru:"«Чья крыша» → whose + roof.",ua:"«Чий дах» → whose + roof.",en:"“Whose roof” → whose + roof."}},{type:"choice",id:"u6h3",question:"Everything ______ he said was a lie.",options:["that","who","whose","where"],correct:"that",explain:{ru:"После неопределённых местоимений (everything, something, all, nothing) используем только that.",ua:"Після невизначених займенників (everything, something, all, nothing) використовуємо лише that.",en:"After indefinite pronouns (everything, something, all, nothing) we use only that."}},{type:"transform",id:"u6h4",instruction:{ru:"Перепиши, опустив относительное слово, если можно:",ua:"Перепиши, пропустивши відносне слово, якщо можна:",en:"Rewrite, dropping the relative word if possible:"},source:"The keys that I lost were found.",answer:["The keys I lost were found"],explain:{ru:"that — дополнение (I lost the keys) → можно опустить: The keys I lost were found.",ua:"that — додаток (I lost the keys) → можна пропустити: The keys I lost were found.",en:"that is an object (I lost the keys) → it can be dropped: The keys I lost were found."}},{type:"gap",id:"u6h5",before:"The town",after:"she was born is famous for its cheese. (where/which)",answer:["where"],explain:{ru:"О месте рождения → where (= in which).",ua:"Про місце народження → where (= in which).",en:"About the place of birth → where (= in which)."}}]}]},tw={id:7,title:{en:"Present Perfect Continuous",ru:"Present Perfect Continuous",ua:"Present Perfect Continuous"},color:"#E63946",colorSoft:"#FBE0E2",theory:[{heading:{ru:"Действие, которое длится до сих пор",ua:"Дія, яка триває досі",en:"An action that is still in progress"},body:{ru:`Это настоящее совершенное продолженное время: действие началось в прошлом, длится до настоящего момента и, возможно, продолжается. Форма: have / has been + глагол с -ing.
Примеры: I have been learning English for five years. (учу до сих пор) She is tired because she has been working all day.`,ua:`Це теперішній доконано-тривалий час: дія почалася в минулому, триває до теперішнього моменту і, можливо, продовжується. Форма: have / has been + дієслово з -ing.
Приклади: I have been learning English for five years. (вчу досі) She is tired because she has been working all day.`,en:`The present perfect continuous shows an action that started in the past, has been in progress up to now, and may still continue. Form: have / has been + verb-ing.
Examples: I have been learning English for five years. (and I still learn) She is tired because she has been working all day.`},table:{head:["","Утверждение","Отрицание","Вопрос"],rows:[["I / You / We / They","have been working","haven't been working","Have you been working?"],["He / She / It","has been working","hasn't been working","Has she been working?"]]},note:{ru:"Маркеры: for, since, all day, all morning, how long, lately, recently.",ua:"Маркери: for, since, all day, all morning, how long, lately, recently.",en:"Markers: for, since, all day, all morning, how long, lately, recently."}},{heading:{ru:"Perfect Continuous или просто Perfect?",ua:"Perfect Continuous чи просто Perfect?",en:"Perfect continuous or plain perfect?"},body:{ru:`Present Perfect Continuous подчёркивает ДЛИТЕЛЬНОСТЬ процесса: How long have you been waiting? (нам важен процесс ожидания)
Present Perfect подчёркивает РЕЗУЛЬТАТ: I have painted the fence. (забор покрашен — работа закончена)
Часто с for/since и глаголами действия нам нужен Continuous: She has been cooking since morning. А с глаголами состояния (know, like) — только Perfect: I have known him for ages.`,ua:`Present Perfect Continuous підкреслює ТРИВАЛІСТЬ процесу: How long have you been waiting? (нам важливий процес очікування)
Present Perfect підкреслює РЕЗУЛЬТАТ: I have painted the fence. (тин пофарбовано — роботу закінчено)
Часто з for/since і дієсловами дії потрібен Continuous: She has been cooking since morning. А з дієсловами стану (know, like) — лише Perfect: I have known him for ages.`,en:`The present perfect continuous stresses the DURATION of a process: How long have you been waiting? (the process matters)
The present perfect stresses the RESULT: I have painted the fence. (the job is done)
With for/since and action verbs we usually need the continuous: She has been cooking since morning. With state verbs (know, like) only the perfect: I have known him for ages.`},table:{head:["Длительность (Continuous)","Результат (Perfect)"],rows:[["I have been writing emails all morning. (процесс)","I have written ten emails. (результат: 10 готовых)"],["It has been raining since dawn. (дождь всё ещё идёт)","It has rained a lot this month. (факт месяца)"]]},note:{ru:"❌ I have been knowing him for years. ✅ I have known him for years. (know — глагол состояния, без Continuous)",ua:"❌ I have been knowing him for years. ✅ I have known him for years. (know — дієслово стану, без Continuous)",en:"❌ I have been knowing him for years. ✅ I have known him for years. (know is a state verb — no continuous)"}}],exercises:[{id:"u7-warmup",title:{ru:"Разминка: формы Perfect Continuous",ua:"Розминка: форми Perfect Continuous",en:"Warm-up: perfect continuous forms"},level:"warmup",items:[{type:"gap",id:"u7w1",before:"I",after:"English for five years, and I still find it exciting. (learn)",answer:["have been learning"],explain:{ru:"for five years + процесс до сих пор → have been learning.",ua:"for five years + процес досі → have been learning.",en:"“For five years” + a process up to now → have been learning."}},{type:"gap",id:"u7w2",before:"She",after:"all morning. That is why she needs a break. (work)",answer:["has been working"],explain:{ru:"all morning + результат сейчас (устала) → has been working.",ua:"all morning + результат зараз (стомилася) → has been working.",en:"“All morning” + a present result (she is tired) → has been working."}},{type:"gap",id:"u7w3",before:"",after:"for the bus long? You look frozen. (you wait)",answer:["have you been waiting"],explain:{ru:"How long + процесс → have you been waiting.",ua:"How long + процес → have you been waiting.",en:"“How long” + a process → have you been waiting."}},{type:"gap",id:"u7w4",before:"They",after:"for this company since 2020. (work)",answer:["have been working"],explain:{ru:"since 2020 + действие до сих пор → have been working.",ua:"since 2020 + дія досі → have been working.",en:"“Since 2020” + an action up to now → have been working."}},{type:"gap",id:"u7w5",before:"He",after:"his essay all evening, but he still has not finished it. (write)",answer:["has been writing"],explain:{ru:"all evening + процесс не завершён → has been writing.",ua:"all evening + процес не завершено → has been writing.",en:"“All evening” + the process is unfinished → has been writing."}},{type:"gap",id:"u7w6",before:"We",after:"each other since we were kids. (know)",answer:["have known"],explain:{ru:"know — глагол состояния → только Perfect: have known.",ua:"know — дієслово стану → лише Perfect: have known.",en:"“Know” is a state verb → only the perfect: have known."}},{type:"match",id:"u7w7",left:["I have been reading for hours.","I have read three chapters.","She has been crying.","Her eyes are red now."],right:["длительность процесса","завершённый результат","процесс с видимым следом","след результата"],pairs:[[0,0],[1,1],[2,0],[3,1]],explain:{ru:"Reading for hours и crying — длительные процессы; read three chapters и red eyes — результаты.",ua:"Reading for hours і crying — тривалі процеси; read three chapters і red eyes — результати.",en:"“Reading for hours” and “crying” are long processes; “read three chapters” and “red eyes” are results."}}]},{id:"u7-core",title:{ru:"Практика: процесс или результат?",ua:"Практика: процес чи результат?",en:"Core practice: process or result?"},level:"core",items:[{type:"choice",id:"u7c1",question:"Your hands are dirty. What ______?",options:["have you been doing","have you done","did you do","do you do"],correct:"have you been doing",explain:{ru:"Видимый след (грязные руки) + процесс → have you been doing.",ua:"Видимий слід (брудні руки) + процес → have you been doing.",en:"Visible evidence (dirty hands) + a process → have you been doing."}},{type:"gap",id:"u7c2",before:"I",after:"ten emails this morning. All of them are sent. (write)",answer:["have written"],explain:{ru:"Результат (10 писем, всё отправлено) → Present Perfect: have written.",ua:"Результат (10 листів, усе надіслано) → Present Perfect: have written.",en:"A result (ten emails, all sent) → present perfect: have written."}},{type:"gap",id:"u7c3",before:"It",after:"since dawn, and the streets are still wet. (rain)",answer:["has been raining"],explain:{ru:"since dawn + дождь, вероятно, продолжается → has been raining.",ua:"since dawn + дощ, ймовірно, триває → has been raining.",en:"“Since dawn” + the rain probably continues → has been raining."}},{type:"choice",id:"u7c4",question:"How long ______ for this company?",options:["have you been working","do you work","did you work","are you working"],correct:"have you been working",explain:{ru:"How long + длительность до сих пор → have you been working.",ua:"How long + тривалість досі → have you been working.",en:"“How long” + duration up to now → have you been working."}},{type:"gap",id:"u7c5",before:"She",after:"TV since she came home from school. (watch)",answer:["has been watching"],explain:{ru:"since + момент в прошлом + продолжающийся процесс → has been watching.",ua:"since + момент у минулому + процес, що триває → has been watching.",en:"“Since” + a past starting point + an ongoing process → has been watching."}},{type:"transform",id:"u7c6",instruction:{ru:"Сделай предложение отрицательным:",ua:"Зроби речення заперечним:",en:"Make the sentence negative:"},source:"They have been arguing again.",answer:["They haven't been arguing again","They have not been arguing again"],explain:{ru:"Отрицание: haven't + been + V-ing → They haven't been arguing again.",ua:"Заперечення: haven't + been + V-ing → They haven't been arguing again.",en:"Negative: haven't + been + V-ing → They haven't been arguing again."}},{type:"choice",id:"u7c7",question:`"You look exhausted!" "I ______ on this report since six o'clock."`,options:["have been working","work","worked","am working"],correct:"have been working",explain:{ru:"since six o'clock + объяснение текущего состояния → have been working.",ua:"since six o'clock + пояснення поточного стану → have been working.",en:"“Since six o'clock” + explaining a current state → have been working."}},{type:"gap",id:"u7c8",before:"I",after:"him for ages. We went to school together. (know)",answer:["have known"],explain:{ru:"know — глагол состояния → Present Perfect без Continuous: have known.",ua:"know — дієслово стану → Present Perfect без Continuous: have known.",en:"“Know” is a state verb → present perfect without continuous: have known."}}]},{id:"u7-challenge",title:{ru:"Вызов: объясняем следы и причины",ua:"Виклик: пояснюємо сліди та причини",en:"Challenge: explaining traces and causes"},level:"challenge",items:[{type:"build",id:"u7h1",words:["all day","has been snowing","It","and the garden is white"],answer:"It has been snowing all day and the garden is white",explain:{ru:"Процесс + результат: It has been snowing all day and the garden is white.",ua:"Процес + результат: It has been snowing all day and the garden is white.",en:"A process plus its result: It has been snowing all day and the garden is white."}},{type:"gap",id:"u7h2",before:"Why are you out of breath?",after:"? (you run)",answer:["have you been running"],explain:{ru:"Видимый след сейчас → have you been running.",ua:"Видимий слід зараз → have you been running.",en:"A visible trace right now → have you been running."}},{type:"choice",id:"u7h3",question:"She ______ 200 pages of the novel so far.",options:["has written","has been writing","writes","wrote"],correct:"has written",explain:{ru:"so far + конкретный результат (200 страниц) → Present Perfect: has written.",ua:"so far + конкретний результат (200 сторінок) → Present Perfect: has written.",en:"“So far” + a concrete result (200 pages) → present perfect: has written."}},{type:"transform",id:"u7h4",instruction:{ru:"Перепиши с Present Perfect Continuous:",ua:"Перепиши з Present Perfect Continuous:",en:"Rewrite using the present perfect continuous:"},source:"She started cooking an hour ago and she is still cooking.",answer:["She has been cooking for an hour","She has been cooking since an hour ago"],explain:{ru:"Действие началось час назад и продолжается → She has been cooking for an hour.",ua:"Дія почалася годину тому і триває → She has been cooking for an hour.",en:"The action started an hour ago and continues → She has been cooking for an hour."}},{type:"gap",id:"u7h5",before:"I am not hungry. I",after:"lunch already. (just have)",answer:["have just had"],explain:{ru:"already + результат (не голоден) → Present Perfect: have just had.",ua:"already + результат (не голодний) → Present Perfect: have just had.",en:"“Already” + a result (not hungry) → present perfect: have just had."}}]}]},nw={id:8,title:{en:"Pronouns. Both/Neither – All/None. Possessives",ru:"Местоимения. Both/Neither – All/None. Приринадлежность",ua:"Займенники. Both/Neither – All/None. Належність"},color:"#0891B2",colorSoft:"#DBF1F6",theory:[{heading:{ru:"Личные и притяжательные местоимения",ua:"Особові та присвійні займенники",en:"Personal and possessive pronouns"},body:{ru:`Личные местоимения: I, you, he, she, it, we, they. Объектные формы: me, you, him, her, it, us, them.
Притяжательные прилагательные стоят ПЕРЕД существительным: my book, her car.
Притяжательные местоимения стоят ВМЕСТО существительного: mine, yours, his, hers, ours, theirs: This book is mine.`,ua:`Особові займенники: I, you, he, she, it, we, they. Об'єктні форми: me, you, him, her, it, us, them.
Присвійні прикметники стоять ПЕРЕД іменником: my book, her car.
Присвійні займенники стоять ЗАМІСТЬ іменника: mine, yours, his, hers, ours, theirs: This book is mine.`,en:`Personal pronouns: I, you, he, she, it, we, they. Object forms: me, you, him, her, it, us, them.
Possessive adjectives go BEFORE a noun: my book, her car.
Possessive pronouns REPLACE a noun: mine, yours, his, hers, ours, theirs: This book is mine.`},table:{head:["Личное (подлежащее)","Объектное","Прилагательное","Местоимение"],rows:[["I","me","my","mine"],["you","you","your","yours"],["he","him","his","his"],["she","her","her","hers"],["we","us","our","ours"],["they","them","their","theirs"]]},note:{ru:"Его машина = his car; Её машина = her car. А «это её (машина)» = it is hers. Не путай: her + существительное, hers — без него.",ua:"Його машина = his car; Її машина = her car. А «це її (машина)» = it is hers. Не плутай: her + іменник, hers — без нього.",en:"His car; her car. But “it is hers” = without a noun. Do not mix: her + noun, hers — without one."}},{heading:{ru:"Both, neither, all, none",ua:"Both, neither, all, none",en:"Both, neither, all, none"},body:{ru:`both = оба (из двух), утверждение: Both my brothers are doctors.
neither = ни один из двух (отрицание!): Neither of my brothers is a doctor.
all = все (из трёх и более) или всё (с неисчисляемыми): All the students passed. All the milk is gone.
none = ни один / ничего (из трёх и более): None of the students failed.`,ua:`both = обидва (з двох), ствердження: Both my brothers are doctors.
neither = жоден з двох (заперечення!): Neither of my brothers is a doctor.
all = усі (з трьох і більше) або все (з незлічуваними): All the students passed. All the milk is gone.
none = жоден / нічого (з трьох і більше): None of the students failed.`,en:`both = the two of them, positive: Both my brothers are doctors.
neither = not one of the two (already negative!): Neither of my brothers is a doctor.
all = everyone (of three or more) or everything (with uncountables): All the students passed. All the milk is gone.
none = not one (of three or more): None of the students failed.`},table:{head:["Слово","Значение","Число","Глагол"],rows:[["both (of)","оба","2","множественное: both are"],["neither (of)","ни один из двух","2","обычно ед.: neither is"],["all (of)","все, всё","3+ / неисчисл.","зависит от существительного"],["none (of)","ни один, ничего","3+","можно is/are"]]},note:{ru:"❌ Both of them don't like it. ✅ Neither of them likes it. (neither уже отрицание — не добавляем not)",ua:"❌ Both of them don't like it. ✅ Neither of them likes it. (neither уже заперечення — не додаємо not)",en:"❌ Both of them don't like it. ✅ Neither of them likes it. (neither is already negative — do not add not)"}},{heading:{ru:"'s или of: как выразить принадлежность",ua:"'s або of: як виразити належність",en:"'s or of: showing possession"},body:{ru:`'s добавляем к людям и животными (и ко времени): Maria's brother, the cat's tail, today's newspaper.
of используем с вещами и абстракциями: the door of the car, the colour of the sky.
Но: с определёнными выражениями 's тоже возможен — запоминайте устойчивые сочетания.`,ua:`'s додаємо до людей і тварин (і до часу): Maria's brother, the cat's tail, today's newspaper.
of використовуємо з речами та абстракціями: the door of the car, the colour of the sky.
Але: з певними виразами 's теж можливий — запам'ятовуйте стійкі сполучення.`,en:`Add 's to people and animals (and time): Maria's brother, the cat's tail, today's newspaper.
Use of with things and abstract ideas: the door of the car, the colour of the sky.
But some set phrases with things also take 's — learn them as fixed phrases.`},table:{head:["'s (люди, животные, время)","of (вещи, абстракции)"],rows:[["my father's house","the leg of the table"],["yesterday's lesson","the end of the film"]]}}],exercises:[{id:"u8-warmup",title:{ru:"Разминка: местоимения",ua:"Розминка: займенники",en:"Warm-up: pronouns"},level:"warmup",items:[{type:"gap",id:"u8w1",before:"This book is",after:". I bought it yesterday. (my/mine)",answer:["mine"],explain:{ru:"Без существительного после → притяжательное местоимение mine.",ua:"Без іменника після → присвійне займенник mine.",en:"With no noun after it → the possessive pronoun mine."}},{type:"gap",id:"u8w2",before:"She gave",after:"her phone number. (I/me)",answer:["me"],explain:{ru:"После глагола gave нужна объектная форма → me.",ua:"Після дієслова gave потрібна об'єктна форма → me.",en:"After the verb “gave” we need the object form → me."}},{type:"gap",id:"u8w3",before:"My parents live in Odesa, but",after:"flat is in the centre and it is very cosy. (their/theirs)",answer:["their"],explain:{ru:"Перед существительным flat → притяжательное прилагательное their.",ua:"Перед іменником flat → присвійний прикметник their.",en:"Before the noun “flat” → the possessive adjective their."}},{type:"gap",id:"u8w4",before:"",after:"of my sisters is married — they are both single. (Neither/Both)",answer:["Neither"],explain:{ru:"Они обе не замужем → ни одна: Neither (уже отрицание).",ua:"Вони обидві не заміжні → жодна: Neither (уже заперечення).",en:"They are both single → not one of them: Neither (already negative)."}},{type:"gap",id:"u8w5",before:"",after:"the children passed the test — a great result! (All/None)",answer:["All"],explain:{ru:"«Отличный результат» → все сдали: All the children.",ua:"«Чудовий результат» → усі здали: All the children.",en:"“A great result” → everyone passed: All the children."}},{type:"gap",id:"u8w6",before:"This is",after:"brother. His name is Tom. (Sara/Sara's)",answer:["Sara's"],explain:{ru:"Принадлежность человека → 's: Sara's brother.",ua:"Належність людини → 's: Sara's brother.",en:"Possession by a person → 's: Sara's brother."}},{type:"match",id:"u8w7",left:["my","mine","her","hers"],right:["перед существительным","вместо существительного"],pairs:[[0,0],[1,1],[2,0],[3,1]],explain:{ru:"my и her — прилагательные (перед существительным), mine и hers — местоимения (вместо него).",ua:"my і her — прикметники (перед іменником), mine і hers — займенники (замість нього).",en:"my and her are adjectives (before a noun), mine and hers are pronouns (instead of it)."}}]},{id:"u8-core",title:{ru:"Практика: both/neither/all/none",ua:"Практика: both/neither/all/none",en:"Core practice: both/neither/all/none"},level:"core",items:[{type:"choice",id:"u8c1",question:"______ of my parents are teachers — Mum teaches maths and Dad teaches history.",options:["Both","Neither","None","All"],correct:"Both",explain:{ru:"Родителей двое + утверждение → Both.",ua:"Батьків двоє + ствердження → Both.",en:"Two parents + a positive sentence → Both."}},{type:"gap",id:"u8c2",before:"",after:"of the five boys could swim, so the coach taught them all. (None/Both)",answer:["None"],explain:{ru:"Их пятеро + «тренер учил всех» → ни один не умел: None of the five boys.",ua:"Їх п'ятеро + «тренер учив усіх» → жоден не вмів: None of the five boys.",en:"Five of them + “the coach taught them all” → not one could swim: None of the five boys."}},{type:"choice",id:"u8c3",question:"I invited Kate and Jane, but ______ of them could come.",options:["neither","none","all","both"],correct:"neither",explain:{ru:"Их двое + but (отрицание) → neither of them.",ua:"Їх двоє + but (заперечення) → neither of them.",en:"Two of them + but (negative sense) → neither of them."}},{type:"gap",id:"u8c4",before:"Is this pen yours? No, it is not",after:". It belongs to Sam. (my/mine)",answer:["mine"],explain:{ru:"it is not + местоимение → mine (без существительного).",ua:"it is not + займенник → mine (без іменника).",en:"it is not + pronoun → mine (no noun)."}},{type:"gap",id:"u8c5",before:"",after:"the cake has been eaten! Who did it? (All/None)",answer:["All"],explain:{ru:"Весь торт (неисчисляемое) → All the cake.",ua:"Весь торт (незлічуване) → All the cake.",en:"The whole cake (uncountable) → All the cake."}},{type:"choice",id:"u8c6",question:"We asked two guides for help, but ______ knew the way.",options:["neither","none","all","both"],correct:"neither",explain:{ru:"Два гида + but → ни один из двух: neither.",ua:"Два гіди + but → жоден з двох: neither.",en:"Two guides + but → not one of the two: neither."}},{type:"transform",id:"u8c7",instruction:{ru:"Перепиши предложение с притяжательным местоимением:",ua:"Перепиши речення з присвійним займенником:",en:"Rewrite the sentence with a possessive pronoun:"},source:"That is my jacket, not your jacket.",answer:["That is my jacket, not yours","That jacket is mine, not yours"],explain:{ru:"your jacket без существительного → yours: That is my jacket, not yours.",ua:"your jacket без іменника → yours: That is my jacket, not yours.",en:"“your jacket” without the noun → yours: That is my jacket, not yours."}},{type:"gap",id:"u8c8",before:"My sister and I love pizza.",after:"of us could eat it every day. (All/Both)",answer:["Both"],explain:{ru:"Нас двое → Both of us.",ua:"Нас двоє → Both of us.",en:"Two of us → Both of us."}}]},{id:"u8-challenge",title:{ru:"Вызов: принадлежность и уточнения",ua:"Виклик: належність та уточнення",en:"Challenge: possession and precision"},level:"challenge",items:[{type:"build",id:"u8h1",words:["of the twins","Neither","likes broccoli"],answer:"Neither of the twins likes broccoli",explain:{ru:"Близнецы — двое + отрицание → Neither of the twins likes broccoli.",ua:"Близнята — двоє + заперечення → Neither of the twins likes broccoli.",en:"Twins are two + a negative → Neither of the twins likes broccoli."}},{type:"gap",id:"u8h2",before:"The tourists visited three museums, but",after:"of them impressed them as much as the first. (none/both)",answer:["none"],explain:{ru:"Три музея + «как первый» → ни один: none of them.",ua:"Три музеї + «як перший» → жоден: none of them.",en:"Three museums + comparison with the first → not one: none of them."}},{type:"choice",id:"u8h3",question:'"Whose glasses are these?" "They are ______."',options:["hers","her","she","herself"],correct:"hers",explain:{ru:"Ответ «её (очки)» без существительного → hers.",ua:"Відповідь «її (окуляри)» без іменника → hers.",en:"Answering “hers” without a noun → hers."}},{type:"gap",id:"u8h4",before:"I do not like the",after:"this soup. It needs more salt. (colour/colour of)",answer:["colour of","color of"],explain:{ru:"Абстракция (цвет супа) → of: the colour of this soup. British spelling: colour.",ua:"Абстракція (колір супу) → of: the colour of this soup. British spelling: colour.",en:"An abstract idea (the colour of the soup) → of: the colour of this soup. British spelling: colour."}},{type:"transform",id:"u8h5",instruction:{ru:"Перепиши, используя both:",ua:"Перепиши, використовуючи both:",en:'Rewrite using "both":'},source:"Tom likes football and Tim likes football too.",answer:["Both Tom and Tim like football","Both of them like football"],explain:{ru:"Два человека + одинаковое действие → Both Tom and Tim like football.",ua:"Дві людини + однакова дія → Both Tom and Tim like football.",en:"Two people + the same action → Both Tom and Tim like football."}}]}]},aw={id:9,title:{en:"Modal verbs I",ru:"Модальные глаголы I",ua:"Модальні дієслова I"},color:"#B45309",colorSoft:"#F6E8D8",theory:[{heading:{ru:"Модальные глаголы: особенности и can/could",ua:"Модальні дієслова: особливості та can/could",en:"Modal verbs: how they work, can and could"},body:{ru:`Модальные глаголы (can, could, may, might, must, should...) выражают способность, разрешение, совет или обязанность. Главные правила:
1. После них глагол в начальной форме БЕЗ to: She can swim. (❌ can to swim, ❌ can swims)
2. Третье лицо без -s: He can drive. (❌ can drives)
3. Вопросы и отрицания БЕЗ do/does: Can you swim? She cannot swim.
can — способность или разрешение сейчас: I can play the guitar. Can I borrow your pen?
could — прошлая способность или вежливая просьба: I could swim when I was five. Could you help me, please?`,ua:`Модальні дієслова (can, could, may, might, must, should...) виражають здатність, дозвіл, пораду або обов'язок. Головні правила:
1. Після них дієслово в початковій формі БЕЗ to: She can swim. (❌ can to swim, ❌ can swims)
2. Третя особа без -s: He can drive. (❌ can drives)
3. Питання і заперечення БЕЗ do/does: Can you swim? She cannot swim.
can — здатність або дозвіл зараз: I can play the guitar. Can I borrow your pen?
could — минула здатність або ввічливе прохання: I could swim when I was five. Could you help me, please?`,en:`Modal verbs (can, could, may, might, must, should...) express ability, permission, advice or obligation. Key rules:
1. They are followed by the base form WITHOUT to: She can swim. (❌ can to swim, ❌ can swims)
2. No -s in the third person: He can drive. (❌ can drives)
3. Questions and negatives WITHOUT do/does: Can you swim? She cannot swim.
can — present ability or permission: I can play the guitar. Can I borrow your pen?
could — past ability or a polite request: I could swim when I was five. Could you help me, please?`},table:{head:["","Утверждение","Отрицание","Вопрос"],rows:[["can","can go","can't go","Can you go?"],["could","could go","couldn't go","Could you go?"]]},note:{ru:"can (= умею) vs be able to: can в прошлом заменяем на could: When I was six, I could ride a bike.",ua:"can (= вмію) vs be able to: can у минулому замінюємо на could: When I was six, I could ride a bike.",en:"can (= have the skill) vs be able to: in the past, can becomes could: When I was six, I could ride a bike."}},{heading:{ru:"may, might, must, should",ua:"may, might, must, should",en:"may, might, must, should"},body:{ru:`may / might — разрешение и возможность: May I come in? (формально) It might rain later. (возможно, но не уверены)
must — сильная необходимость или уверенный вывод: You must wear a seatbelt. (правило) You must be tired. (вывод: наверняка)
mustn't — запрещено: You mustn't smoke here.
should — совет: You should eat more vegetables.`,ua:`may / might — дозвіл і можливість: May I come in? (формально) It might rain later. (можливо, але не впевнені)
must — сильна необхідність або впевнений висновок: You must wear a seatbelt. (правило) You must be tired. (висновок: напевно)
mustn't — заборонено: You mustn't smoke here.
should — порада: You should eat more vegetables.`,en:`may / might — permission and possibility: May I come in? (formal) It might rain later. (possibly, not sure)
must — strong necessity or a confident conclusion: You must wear a seatbelt. (a rule) You must be tired. (a conclusion: surely)
mustn't — forbidden: You mustn't smoke here.
should — advice: You should eat more vegetables.`},table:{head:["Модальный","Значение","Пример"],rows:[["may","разрешение (формальное)","May I open the window?"],["might","возможность (сомнение)","She might be at home."],["must","обязанность / уверенность","You must see a doctor."],["mustn't","запрет","You mustn't touch this."],["should","совет","You should apologise."]]},note:{ru:"❌ He can swims. ✅ He can swim. ❌ Do you can drive? ✅ Can you drive?",ua:"❌ He can swims. ✅ He can swim. ❌ Do you can drive? ✅ Can you drive?",en:"❌ He can swims. ✅ He can swim. ❌ Do you can drive? ✅ Can you drive?"}}],exercises:[{id:"u9-warmup",title:{ru:"Разминка: can и could",ua:"Розминка: can і could",en:"Warm-up: can and could"},level:"warmup",items:[{type:"gap",id:"u9w1",before:"She",after:"three languages fluently. (can)",answer:["can speak"],explain:{ru:"can + начальная форма без to → can speak.",ua:"can + початкова форма без to → can speak.",en:"can + the base form without to → can speak."}},{type:"gap",id:"u9w2",before:"When I was five, I",after:"a bike without help. (can, past)",answer:["could ride"],explain:{ru:"Прошлая способность → could + ride.",ua:"Минула здатність → could + ride.",en:"Past ability → could + ride."}},{type:"gap",id:"u9w3",before:"",after:"me with this box, please? It is heavy. (you could)",answer:["could you help"],explain:{ru:"Вежливая просьба: Could you help me...?",ua:"Ввічливе прохання: Could you help me...?",en:"A polite request: Could you help me...?"}},{type:"choice",id:"u9w4",question:"My grandpa ______ hear very well, so speak loudly.",options:["can't","doesn't can","don't can","isn't can"],correct:"can't",explain:{ru:"Отрицание с can: can't, без вспомогательных глаголов.",ua:"Заперечення з can: can't, без допоміжних дієслів.",en:"Negative with can: can't, with no auxiliary verbs."}},{type:"gap",id:"u9w5",before:"",after:"I use your dictionary, please? (may)",answer:["may"],explain:{ru:"Формальное разрешение: May I...?",ua:"Формальний дозвіл: May I...?",en:"Formal permission: May I...?"}},{type:"gap",id:"u9w6",before:"You",after:"here — it is a hospital corridor. (smoke, запрет)",answer:["mustn't smoke","must not smoke"],explain:{ru:"Запрет → mustn't + начальная форма.",ua:"Заборона → mustn't + початкова форма.",en:"A prohibition → mustn't + base form."}},{type:"match",id:"u9w7",left:["can","could","may","must"],right:["разрешение сейчас","вежливая просьба","формальное разрешение","обязанность"],pairs:[[0,0],[1,1],[2,2],[3,3]],explain:{ru:"can — разрешение сейчас, could — вежливая просьба, may — формально, must — обязанность.",ua:"can — дозвіл зараз, could — ввічливе прохання, may — формально, must — обов'язок.",en:"can — permission now, could — a polite request, may — formal permission, must — obligation."}}]},{id:"u9-core",title:{ru:"Практика: выбираем модальный глагол",ua:"Практика: обираємо модальне дієслово",en:"Core practice: choosing the modal"},level:"core",items:[{type:"choice",id:"u9c1",question:"It is going to be cold tonight. You ______ take a jacket.",options:["should","mustn't","can","may not"],correct:"should",explain:{ru:"Совет на будущее → should take.",ua:"Порада на майбутнє → should take.",en:"Advice about the future → should take."}},{type:"gap",id:"u9c2",before:"I do not know where Kate is. She",after:"at her friend's house. (might)",answer:["might be"],explain:{ru:"Неуверенное предположение → might + be.",ua:"Невпевне припущення → might + be.",en:"An uncertain guess → might + be."}},{type:"choice",id:"u9c3",question:"You ______ your homework before you watch TV. It is a family rule.",options:["must do","must to do","must doing","mustn't do"],correct:"must do",explain:{ru:"Правило семьи → обязанность: must + начальная форма.",ua:"Правило родини → обов'язок: must + початкова форма.",en:"A family rule → obligation: must + base form."}},{type:"gap",id:"u9c4",before:"",after:"you swim when you were seven? (can, past)",answer:["could"],explain:{ru:"when you were seven → прошлое → Could you swim?",ua:"when you were seven → минуле → Could you swim?",en:"“When you were seven” → the past → Could you swim?"}},{type:"choice",id:"u9c5",question:'"______ I borrow your pen?" "Of course, here you are."',options:["Can","Must","Should","Can't"],correct:"Can",explain:{ru:"Разрешение попросить что-то вежливо → Can I borrow...?",ua:"Дозвіл попросити щось ввічливо → Can I borrow...?",en:"Politely asking permission → Can I borrow...?"}},{type:"gap",id:"u9c6",before:"You look so pale! You",after:"a doctor immediately. (see, совет)",answer:["should see"],explain:{ru:"Совет о действии → should + see.",ua:"Порада про дію → should + see.",en:"Advice about an action → should + see."}},{type:"transform",id:"u9c7",instruction:{ru:"Сделай предложение отрицательным:",ua:"Зроби речення заперечним:",en:"Make the sentence negative:"},source:"They must wait here.",answer:["They mustn't wait here","They must not wait here"],explain:{ru:"Отрицание must: mustn't → They mustn't wait here.",ua:"Заперечення must: mustn't → They mustn't wait here.",en:"Negative of must: mustn't → They mustn't wait here."}},{type:"gap",id:"u9c8",before:"Guests",after:"after 10 pm. The doors are locked then. (come, запрет)",answer:["mustn't come","must not come"],explain:{ru:"Запрет (двери заперты) → mustn't come.",ua:"Заборона (двері замкнено) → mustn't come.",en:"A prohibition (the doors are locked) → mustn't come."}}]},{id:"u9-challenge",title:{ru:"Вызов: ситуации и догадки",ua:"Виклик: ситуації та здогадки",en:"Challenge: situations and guesses"},level:"challenge",items:[{type:"build",id:"u9h1",words:["be","You","exhausted","after such a long journey","must"],answer:"You must be exhausted after such a long journey",explain:{ru:"Уверенный вывод → must + be: You must be exhausted after such a long journey.",ua:"Впевнений висновок → must + be: You must be exhausted after such a long journey.",en:"A confident conclusion → must + be: You must be exhausted after such a long journey."}},{type:"choice",id:"u9h2",question:"Take an umbrella — it ______ later.",options:["might rain","must rain","rains","raining"],correct:"might rain",explain:{ru:"Возможность, не уверены → might rain.",ua:"Можливість, не впевнені → might rain.",en:"A possibility, not sure → might rain."}},{type:"gap",id:"u9h3",before:"When my dad was young, he",after:"100 metres in 12 seconds. (run, past)",answer:["could run"],explain:{ru:"Прошлая способность → could run.",ua:"Минула здатність → could run.",en:"Past ability → could run."}},{type:"transform",id:"u9h4",instruction:{ru:"Перефразируй с must:",ua:"Перефразуй з must:",en:'Rephrase using "must":'},source:"It is forbidden to park here.",answer:["You mustn't park here","You must not park here"],explain:{ru:"Запрет → You mustn't park here.",ua:"Заборона → You mustn't park here.",en:"A prohibition → You mustn't park here."}},{type:"gap",id:"u9h5",before:"You",after:"so much sweets. It is bad for your teeth. (eat, совет-отриц.)",answer:["shouldn't eat","should not eat"],explain:{ru:"Отрицательный совет → shouldn't + eat.",ua:"Заперечна порада → shouldn't + eat.",en:"Negative advice → shouldn't + eat."}}]}]},iw={id:10,title:{en:"Infinitive and -ing form. Too/Enough",ru:"Инфинитив и «-ing»-форма. Too/Enough",ua:"Інфінітив та «-ing»-форма. Too/Enough"},color:"#65A30D",colorSoft:"#E8F3D9",theory:[{heading:{ru:"Глагол + инфинитив (to do)",ua:"Дієслово + інфінітив (to do)",en:"Verb + infinitive (to do)"},body:{ru:`После некоторых глаголов идёт инфинитив с to: want, would like, decide, hope, plan, agree, promise, learn, offer.
Примеры: I want to buy a new phone. She decided to study medicine. He promised to call me.
would love / would like + to do: I would like to visit Japan one day.`,ua:`Після деяких дієслів іде інфінітив з to: want, would like, decide, hope, plan, agree, promise, learn, offer.
Приклади: I want to buy a new phone. She decided to study medicine. He promised to call me.
would love / would like + to do: I would like to visit Japan one day.`,en:`After certain verbs we use the infinitive with to: want, would like, decide, hope, plan, agree, promise, learn, offer.
Examples: I want to buy a new phone. She decided to study medicine. He promised to call me.
would love / would like + to do: I would like to visit Japan one day.`},table:{head:["Глагол","Пример"],rows:[["want","I want to leave now."],["decide","They decided to wait."],["hope","We hope to see you soon."],["promise","She promised to help."]]},note:{ru:"❌ I want buy a car. ✅ I want to buy a car.",ua:"❌ I want buy a car. ✅ I want to buy a car.",en:"❌ I want buy a car. ✅ I want to buy a car."}},{heading:{ru:"Глагол + -ing (doing)",ua:"Дієслово + -ing (doing)",en:"Verb + -ing (doing)"},body:{ru:`Другие глаголы требуют -ing-форму: enjoy, finish, mind, suggest, practise, keep, avoid, admit, give up, look forward to.
Примеры: I enjoy cooking. Have you finished reading? She suggested going to the cinema. I look forward to meeting you. (to здесь предлог!)
like, love, start, remember, stop, try могут идти и с to do, и с doing, но смысл меняется.`,ua:`Інші дієслова вимагають -ing-форму: enjoy, finish, mind, suggest, practise, keep, avoid, admit, give up, look forward to.
Приклади: I enjoy cooking. Have you finished reading? She suggested going to the cinema. I look forward to meeting you. (to тут прийменник!)
like, love, start, remember, stop, try можуть іти і з to do, і з doing, але зміст змінюється.`,en:`Other verbs take the -ing form: enjoy, finish, mind, suggest, practise, keep, avoid, admit, give up, look forward to.
Examples: I enjoy cooking. Have you finished reading? She suggested going to the cinema. I look forward to meeting you. (here “to” is a preposition!)
like, love, start, remember, stop, try can take both to do and doing, but the meaning changes.`},table:{head:["С to do","С doing","Разница"],rows:[["I stopped to smoke. (остановился, чтобы закурить)","I stopped smoking. (бросил курить)","остановились с целью / прекратили действие"],["Remember to lock the door. (не забудь)","I remember locking the door. (помню, что запер)","будущее действие / прошлое воспоминание"],["Try to open it. (постарайся)","Try pressing this button. (попробуй — эксперимент)","усилие / эксперимент"]]},note:{ru:"❌ I enjoy to cook. ✅ I enjoy cooking. ❌ She suggested to go. ✅ She suggested going.",ua:"❌ I enjoy to cook. ✅ I enjoy cooking. ❌ She suggested to go. ✅ She suggested going.",en:"❌ I enjoy to cook. ✅ I enjoy cooking. ❌ She suggested to go. ✅ She suggested going."}},{heading:{ru:"Too и enough: достаточно ли?",ua:"Too і enough: чи достатньо?",en:"Too and enough: is it sufficient?"},body:{ru:`too + прилагательное/наречие + to do = «слишком ... чтобы»: The soup is too hot to eat. He drives too fast to be safe.
enough + существительное: enough money, enough time. Прилагательное + enough: old enough, good enough.
adjective/adverb + enough + to do: She is old enough to drive. The chair is not comfortable enough to sit on.`,ua:`too + прикметник/прислівник + to do = «занадто ... щоб»: The soup is too hot to eat. He drives too fast to be safe.
enough + іменник: enough money, enough time. Прикметник + enough: old enough, good enough.
adjective/adverb + enough + to do: She is old enough to drive. The chair is not comfortable enough to sit on.`,en:`too + adjective/adverb + to do = “excessively ... to”: The soup is too hot to eat. He drives too fast to be safe.
enough + noun: enough money, enough time. Adjective + enough: old enough, good enough.
adjective/adverb + enough + to do: She is old enough to drive. The chair is not comfortable enough to sit on.`},table:{head:["Конструкция","Пример"],rows:[["too + adj + to do","It is too cold to swim."],["adj + enough + to do","She is tall enough to reach it."],["enough + noun","We have enough chairs for everyone."],["not + adj + enough + to do","This phone isn't cheap enough to buy."]]},note:{ru:"Порядок важен: ❌ enough old ✅ old enough. ❌ too enough ✅ не сочетаются.",ua:"Порядок важливий: ❌ enough old ✅ old enough. ❌ too enough ✅ не поєднуються.",en:"Word order matters: ❌ enough old ✅ old enough. ❌ too enough ✅ they never combine."}}],exercises:[{id:"u10-warmup",title:{ru:"Разминка: to do или doing?",ua:"Розминка: to do чи doing?",en:"Warm-up: to do or doing?"},level:"warmup",items:[{type:"gap",id:"u10w1",before:"I want",after:"a new phone next month. (buy)",answer:["to buy"],explain:{ru:"want + to do → to buy.",ua:"want + to do → to buy.",en:"want + to do → to buy."}},{type:"gap",id:"u10w2",before:"She enjoys",after:"long walks in the evening. (take)",answer:["taking"],explain:{ru:"enjoy + doing → taking.",ua:"enjoy + doing → taking.",en:"enjoy + doing → taking."}},{type:"gap",id:"u10w3",before:"Have you finished",after:"your essay yet? (write)",answer:["writing"],explain:{ru:"finish + doing → writing.",ua:"finish + doing → writing.",en:"finish + doing → writing."}},{type:"gap",id:"u10w4",before:"They decided",after:"abroad for their holidays. (go)",answer:["to go"],explain:{ru:"decide + to do → to go.",ua:"decide + to do → to go.",en:"decide + to do → to go."}},{type:"gap",id:"u10w5",before:"He promised",after:"me as soon as he arrived. (call)",answer:["to call"],explain:{ru:"promise + to do → to call.",ua:"promise + to do → to call.",en:"promise + to do → to call."}},{type:"gap",id:"u10w6",before:"I look forward to",after:"from you soon. (hear)",answer:["hearing"],explain:{ru:"look forward to + doing (to — предлог) → hearing.",ua:"look forward to + doing (to — прийменник) → hearing.",en:"look forward to + doing (“to” is a preposition here) → hearing."}},{type:"match",id:"u10w7",left:["want","enjoy","finish","hope"],right:["+ to do","+ doing"],pairs:[[0,0],[1,1],[2,1],[3,0]],explain:{ru:"want и hope + to do; enjoy и finish + doing.",ua:"want і hope + to do; enjoy і finish + doing.",en:"want and hope + to do; enjoy and finish + doing."}}]},{id:"u10-core",title:{ru:"Практика: too и enough",ua:"Практика: too і enough",en:"Core practice: too and enough"},level:"core",items:[{type:"gap",id:"u10c1",before:"The soup is",after:"to eat. Wait a few minutes. (hot)",answer:["too hot"],explain:{ru:"Слишком горячий, чтобы есть → too hot to eat.",ua:"Занадто гарячий, щоб їсти → too hot to eat.",en:"Excessively hot to eat → too hot to eat."}},{type:"gap",id:"u10c2",before:"She is",after:"to drive a car in the UK. (old)",answer:["old enough"],explain:{ru:"Достаточно взрослая → old enough (enough после прилагательного).",ua:"Достатньо доросла → old enough (enough після прикметника).",en:"Old enough → old enough (enough goes after the adjective)."}},{type:"choice",id:"u10c3",question:"We have ______ time to catch the train. Let's hurry!",options:["enough","too","very enough","enough too"],correct:"enough",explain:{ru:"enough + существительное (time) → enough time.",ua:"enough + іменник (time) → enough time.",en:"enough + noun (time) → enough time."}},{type:"gap",id:"u10c4",before:"He plays the piano",after:"to perform in concerts. (well)",answer:["well enough"],explain:{ru:"Наречие + enough + to do → well enough.",ua:"Прислівник + enough + to do → well enough.",en:"Adverb + enough + to do → well enough."}},{type:"gap",id:"u10c5",before:"This exercise is",after:"for a beginner to understand. (difficult)",answer:["too difficult"],explain:{ru:"too + прилагательное + to do → too difficult to understand.",ua:"too + прикметник + to do → too difficult to understand.",en:"too + adjective + to do → too difficult to understand."}},{type:"choice",id:"u10c6",question:"I stopped ______ years ago. I am much healthier now.",options:["smoking","to smoke","smoke","smoked"],correct:"smoking",explain:{ru:"stop + doing = прекратить действие → stopped smoking (бросил курить).",ua:"stop + doing = припинити дію → stopped smoking (кинув курити).",en:"stop + doing = quit an activity → stopped smoking (gave it up)."}},{type:"transform",id:"u10c7",instruction:{ru:"Перепиши, используя too:",ua:"Перепиши, використовуючи too:",en:'Rewrite using "too":'},source:"The bag is so heavy that I cannot lift it.",answer:["The bag is too heavy to lift","The bag is too heavy for me to lift"],explain:{ru:"so...that + отрицание = too + adj + to do: The bag is too heavy to lift.",ua:"so...that + заперечення = too + adj + to do: The bag is too heavy to lift.",en:"so...that + negative = too + adjective + to do: The bag is too heavy to lift."}},{type:"gap",id:"u10c8",before:"Remember",after:"the door before you leave. (lock)",answer:["to lock"],explain:{ru:"remember + to do = не забыть (будущее действие) → to lock.",ua:"remember + to do = не забути (майбутня дія) → to lock.",en:"remember + to do = do not forget (a future action) → to lock."}}]},{id:"u10-challenge",title:{ru:"Вызов: смысловые различия",ua:"Виклик: змістові відмінності",en:"Challenge: meaning differences"},level:"challenge",items:[{type:"build",id:"u10h1",words:["cooking","enjoys","She","for her friends"],answer:"She enjoys cooking for her friends",explain:{ru:"enjoy + doing: She enjoys cooking for her friends.",ua:"enjoy + doing: She enjoys cooking for her friends.",en:"enjoy + doing: She enjoys cooking for her friends."}},{type:"choice",id:"u10h2",question:"I saw Kate at the station, but she was in a hurry, so I stopped ______ her.",options:["to call","calling","call","called"],correct:"to call",explain:{ru:"stop + to do = остановиться, чтобы что-то сделать → stopped to call (остановился, чтобы позвонить).",ua:"stop + to do = зупинитися, щоб щось зробити → stopped to call (зупинився, щоб подзвонити).",en:"stop + to do = pause in order to do something → stopped to call (paused to phone her)."}},{type:"gap",id:"u10h3",before:"I remember",after:"this film with my dad when I was small. (watch)",answer:["watching"],explain:{ru:"remember + doing = помнить, что делал в прошлом → watching.",ua:"remember + doing = пам'ятати, що робив у минулому → watching.",en:"remember + doing = recall a past action → watching."}},{type:"transform",id:"u10h4",instruction:{ru:"Перепиши, используя enough:",ua:"Перепиши, використовуючи enough:",en:'Rewrite using "enough":'},source:"She is very clever. She can solve any puzzle.",answer:["She is clever enough to solve any puzzle"],explain:{ru:"adjective + enough + to do: She is clever enough to solve any puzzle.",ua:"adjective + enough + to do: She is clever enough to solve any puzzle.",en:"adjective + enough + to do: She is clever enough to solve any puzzle."}},{type:"gap",id:"u10h5",before:"The film was boring, so we suggested",after:"home early. (go)",answer:["going"],explain:{ru:"suggest + doing → going.",ua:"suggest + doing → going.",en:"suggest + doing → going."}}]}]},lw={id:1,title:{en:"Round-up 1 (Units 1–5)",ru:"Повторение 1 (Units 1–5)",ua:"Повторення 1 (Units 1–5)"},covers:[1,2,3,4,5],intro:{ru:"Смешанные задания по всем темам юнитов 1–5. Вопросы идут в случайном порядке и с разной сложностью — внимательно читай маркеры времени!",ua:"Змішані завдання за всіма темами юнітів 1–5. Питання йдуть у випадковому порядку та з різною складністю — уважно читай маркери часу!",en:"Mixed tasks from all the topics of Units 1–5. Questions come in random order and varying difficulty — read the time markers carefully!"},exercises:[{id:"r1-check",title:{ru:"Проверка: вспоминаем всё",ua:"Перевірка: згадуємо все",en:"Check-up: remembering it all"},level:"warmup",items:[{type:"choice",id:"r1a1",question:"My sister ______ yoga every morning before work.",options:["practises","practise","is practising","practising"],correct:"practises",explain:{ru:"every morning — привычка → Present Simple, she → practises.",ua:"every morning — звичка → Present Simple, she → practises.",en:"“Every morning” — a habit → present simple, she → practises."}},{type:"gap",id:"r1a2",before:"They",after:"house last month. The new flat is bigger. (move)",answer:["moved"],explain:{ru:"last month → Past Simple: moved.",ua:"last month → Past Simple: moved.",en:"“Last month” → past simple: moved."}},{type:"gap",id:"r1a3",before:"What",after:"when I called you? You sounded busy. (you do)",answer:["were you doing"],explain:{ru:"Процесс в момент звонка → were you doing.",ua:"Процес в момент дзвінка → were you doing.",en:"A process at the moment of the call → were you doing."}},{type:"gap",id:"r1a4",before:"I",after:"that exhibition. Let's go and see something else. (already see)",answer:["have already seen"],explain:{ru:"already → Present Perfect: have already seen (результат: смотреть повторно не хочется).",ua:"already → Present Perfect: have already seen (результат: дивитися повторно не хочеться).",en:"“Already” → present perfect: have already seen."}},{type:"choice",id:"r1a5",question:'"I have decided to tidy my room." "Wait, I ______ you!"',options:["will help","am going to help","help","helping"],correct:"will help",explain:{ru:"Спонтанное предложение помощи → will help.",ua:"Спонтанна пропозиція допомоги → will help.",en:"A spontaneous offer of help → will help."}},{type:"gap",id:"r1a6",before:"Be quiet! The exam",after:". (begin)",answer:["is beginning"],explain:{ru:"Be quiet! — действие прямо сейчас → is beginning.",ua:"Be quiet! — дія просто зараз → is beginning.",en:"“Be quiet!” — an action right now → is beginning."}},{type:"gap",id:"r1a7",before:"We",after:"chess every evening when we were students. (use to play)",answer:["used to play"],explain:{ru:"Привычка из прошлого (were students) → used to play.",ua:"Звичка з минулого (were students) → used to play.",en:"A past habit (were students) → used to play."}},{type:"gap",id:"r1a8",before:"She",after:"in this company since 2019. (be)",answer:["has been"],explain:{ru:"since + год → Present Perfect: has been.",ua:"since + рік → Present Perfect: has been.",en:"“Since” + a year → present perfect: has been."}}]},{id:"r1-mix",title:{ru:"Микс: времена в действии",ua:"Мікс: часи в дії",en:"Mix: tenses in action"},level:"core",items:[{type:"choice",id:"r1b1",question:"Did they ______ the museum yesterday afternoon?",options:["visit","visited","visiting","visits"],correct:"visit",explain:{ru:"После Did — начальная форма: visit.",ua:"Після Did — початкова форма: visit.",en:"After “Did” — the base form: visit."}},{type:"gap",id:"r1b2",before:"I think I",after:"home this evening. I am really tired. (stay)",answer:["will stay","'ll stay"],explain:{ru:"Решение, принятое в момент речи → will stay.",ua:"Рішення, прийняте у момент мовлення → will stay.",en:"A decision made while speaking → will stay."}},{type:"transform",id:"r1b3",instruction:{ru:"Перепиши предложение, добавив already:",ua:"Перепиши речення, додавши already:",en:'Rewrite the sentence adding "already":'},source:"I have finished my essay.",answer:["I have already finished my essay"],explain:{ru:"already между have и V3: I have already finished my essay.",ua:"already між have і V3: I have already finished my essay.",en:"“Already” goes between have and V3: I have already finished my essay."}},{type:"gap",id:"r1b4",before:"While we",after:"for the train, we drank some coffee. (wait)",answer:["were waiting"],explain:{ru:"while + длинный процесс → were waiting.",ua:"while + довгий процес → were waiting.",en:"while + a long process → were waiting."}},{type:"choice",id:"r1b5",question:"He ______ his bike to work every day, but today he ______ the bus.",options:["rides / is taking","is riding / takes","ride / is taking","rides / takes"],correct:"rides / is taking",explain:{ru:"every day → rides (привычка); today + временная ситуация → is taking.",ua:"every day → rides (звичка); today + тим
